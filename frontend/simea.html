// Helpers de formato de fecha en formato 24h consistente
function formatearFechaHora(fecha) {
  const d = new Date(fecha);
  const opciones = {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  };
  return d.toLocaleString('es-AR', opciones);
}

function formatearHora(fecha) {
  const d = new Date(fecha);
  const opciones = {
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  };
  return d.toLocaleTimeString('es-AR', opciones);
}

const api = {
  login: function(username, password) {
    const formData = new URLSearchParams();
    formData.append('username', username);
    formData.append('password', password);
    return fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData,
    }).then(function(r) {
      if (!r.ok) throw new Error('Credenciales inválidas');
      return r.json();
    });
  },
  get: function(path, token) {
    return fetch(API_BASE + path, {
      headers: { Authorization: 'Bearer ' + token },
    }).then(function(r) {
      if (!r.ok) throw new Error('Error ' + r.status);
      return r.json();
    });
  },
  post: function(path, token, body) {
    return fetch(API_BASE + path, {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: body ? JSON.stringify(body) : null,
    }).then(function(r) {
      if (!r.ok) {
        return r.json().catch(function() { return { detail: 'Error desconocido' }; })
          .then(function(err) { throw new Error(err.detail || 'Error ' + r.status); });
      }
      return r.json();
    });
  },
  put: function(path, token, body) {
    return fetch(API_BASE + path, {
      method: 'PUT',
      headers: {
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: body ? JSON.stringify(body) : null,
    }).then(function(r) {
      if (!r.ok) {
        return r.json().catch(function() { return { detail: 'Error desconocido' }; })
          .then(function(err) { throw new Error(err.detail || 'Error ' + r.status); });
      }
      return r.json();
    });
  },
  delete: function(path, token) {
    return fetch(API_BASE + path, {
      method: 'DELETE',
      headers: { Authorization: 'Bearer ' + token },
    }).then(function(r) {
      if (!r.ok) {
        return r.json().catch(function() { return { detail: 'Error desconocido' }; })
          .then(function(err) { throw new Error(err.detail || 'Error ' + r.status); });
      }
      return r.json();
    });
  },
};

function ParticlesBackground() {
  const canvasRef = useRef(null);

  useEffect(function() {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const cantidadParticulas = Math.min(80, Math.floor((canvas.width * canvas.height) / 18000));
    const distanciaConexion = 140;
    const particulas = [];

    for (let i = 0; i < cantidadParticulas; i++) {
      particulas.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        radio: Math.random() * 1.8 + 0.8,
      });
    }

    let animationId;
    function animar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Mover y dibujar partículas
      for (let i = 0; i < particulas.length; i++) {
        const p = particulas[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radio, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(96, 165, 250, 0.6)';
        ctx.fill();
      }

      // Dibujar conexiones entre partículas cercanas
      for (let i = 0; i < particulas.length; i++) {
        for (let j = i + 1; j < particulas.length; j++) {
          const dx = particulas[i].x - particulas[j].x;
          const dy = particulas[i].y - particulas[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < distanciaConexion) {
            const opacidad = (1 - dist / distanciaConexion) * 0.25;
            ctx.beginPath();
            ctx.moveTo(particulas[i].x, particulas[i].y);
            ctx.lineTo(particulas[j].x, particulas[j].y);
            ctx.strokeStyle = 'rgba(96, 165, 250, ' + opacidad + ')';
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }

      animationId = requestAnimationFrame(animar);
    }
    animar();

    return function() {
      cancelAnimationFrame(animationId);
      window.removeEventListener('resize', resize);
    };
  }, []);

  return (
    <canvas
      ref={canvasRef}
      className="absolute inset-0 w-full h-full pointer-events-none"
      style={{ zIndex: 0 }}
    />
  );
}

function LoginView(props) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  function submit(e) {
    e.preventDefault();
    setError('');
    setLoading(true);
    api.login(username, password)
      .then(function(result) {
        props.onLogin({ token: result.access_token, usuario: result.usuario, rol: result.rol });
      })
      .catch(function(err) {
        setError(err.message || 'Error al iniciar sesión');
      })
      .finally(function() {
        setLoading(false);
      });
  }

  return (
    <div className="min-h-screen relative flex items-center justify-center px-4 overflow-hidden">
      <ParticlesBackground />
      <div className="w-full max-w-sm relative" style={{ zIndex: 1 }}>

            Sistema Integrado de Monitoreo Energético y Anomalías

        </div>

          <form onSubmit={submit} className="space-y-4">
            <div>
              <label className="block text-xs font-medium text-simea-muted mb-1.5 uppercase tracking-wider">Usuario</label>
              <input
                type="text"
                value={username}
                onChange={function(e) { setUsername(e.target.value); }}
                className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2.5 text-simea-text focus:outline-none focus:border-simea-accent transition"
                autoFocus
              />
            </div>
            <div>
              <label className="block text-xs font-medium text-simea-muted mb-1.5 uppercase tracking-wider">Contraseña</label>
              <input
                type="password"
                value={password}
                onChange={function(e) { setPassword(e.target.value); }}

function GaugeFP(props) {
  const valor = Math.max(0, Math.min(1, props.valor || 0));

  let colorPrincipal = "#10B981";
  let colorTexto = "text-emerald-300";
  let etiqueta = "Bueno";
  if (valor < 0.50) {
    colorPrincipal = "#EF4444";
    colorTexto = "text-red-400";
    etiqueta = "Bajo";
  } else if (valor < 0.80) {
    colorPrincipal = "#F59E0B";
    colorTexto = "text-amber-300";
    etiqueta = "Aceptable";
  }

  const radio = 40;
  const circunferencia = 2 * Math.PI * radio;
  const relleno = circunferencia * valor;

  return (
    <div className="flex flex-col items-center gap-3 w-full">
      <div className="text-xs uppercase tracking-wider text-simea-muted text-center">Factor de potencia</div>
      <div className="relative flex-shrink-0" style={{ width: "100px", height: "100px" }}>
        <svg width="100" height="100" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r={radio} fill="none" stroke="#1F2733" strokeWidth="8" />
          <circle
            cx="50"
            cy="50"
            r={radio}
            fill="none"
            stroke={colorPrincipal}
            strokeWidth="8"
            strokeLinecap="round"
            strokeDasharray={circunferencia + " " + circunferencia}
            strokeDashoffset={circunferencia - relleno}
            transform="rotate(-90 50 50)"
            style={{ transition: "stroke-dashoffset 0.4s ease" }}
          />
        </svg>
        <div className="absolute inset-0 flex items-center justify-center">
          <span className={"text-xl font-bold mono " + colorTexto}>
            {valor.toFixed(2)}
          </span>
        </div>
      </div>
      <div className={"text-sm font-semibold " + colorTexto}>{etiqueta}</div>
    </div>
  );
}

function GraficoDetalleModal(props) {
  if (!props.abierto) return null;

  // Calcular estadísticas del rango visible
  const valores = props.datos.map(function(d) { return d.valor; });
  const stats = {
    actual: props.valorActual,
    min: valores.length > 0 ? Math.min.apply(null, valores) : null,
    max: valores.length > 0 ? Math.max.apply(null, valores) : null,
    promedio: valores.length > 0 ? valores.reduce(function(a, b) { return a + b; }, 0) / valores.length : null,
    muestras: props.datos.length,
  };

  function descargarCSV() {
    if (!props.datos || props.datos.length === 0) return;

    function toHoraLocal(isoUtc) {
      const d = new Date(isoUtc);
      if (isNaN(d.getTime())) return isoUtc;
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      return yyyy + '-' + mm + '-' + dd + ' ' + hh + ':' + mi + ':' + ss;
    }

    const filas = ['sep=;', 'timestamp;valor'];
    props.datos.forEach(function(d) {
      // Convertir punto decimal a coma decimal para formato argentino
      const valorAR = String(d.valor).replace('.', ',');
      const tsLocal = toHoraLocal(d.timestamp);
      filas.push(tsLocal + ';' + valorAR);
    });
    // BOM UTF-8 para que Excel reconozca acentos correctamente
    const BOM = '\uFEFF';
    const blob = new Blob([BOM + filas.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = props.titulo.replace(/\s+/g, '_').toLowerCase() + '_' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center p-4"
      style={{ backgroundColor: 'rgba(0,0,0,0.75)' }}
      onClick={props.onCerrar}
    >
      <div
        className="bg-simea-surface border border-simea-border rounded-2xl w-full max-w-6xl max-h-[90vh] overflow-auto"
        onClick={function(e) { e.stopPropagation(); }}
      >
        <div className="p-6">
          <div className="flex items-center justify-between mb-6">
            <div>
              <h2 className="text-xl font-bold">{props.titulo}</h2>
              <p className="text-sm text-simea-muted mt-1">Vista detallada</p>
            </div>
            <button
              onClick={props.onCerrar}
              className="w-8 h-8 rounded-lg flex items-center justify-center text-simea-muted hover:text-simea-text hover:bg-simea-card transition"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>

          {/* Estadísticas */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div className="bg-simea-card border border-simea-border rounded-xl p-3">
              <div className="text-xs uppercase tracking-wider text-simea-muted mb-1">Actual</div>
              <div className="text-lg font-bold mono" style={{ color: props.color }}>
                {stats.actual !== null && stats.actual !== undefined ? stats.actual.toFixed(3) : '—'} <span className="text-xs text-simea-muted">{props.unidad}</span>
              </div>
            </div>
            <div className="bg-simea-card border border-simea-border rounded-xl p-3">
              <div className="text-xs uppercase tracking-wider text-simea-muted mb-1">Promedio</div>
              <div className="text-lg font-bold mono">
                {stats.promedio !== null ? stats.promedio.toFixed(3) : '—'} <span className="text-xs text-simea-muted">{props.unidad}</span>
              </div>
            </div>
            <div className="bg-simea-card border border-simea-border rounded-xl p-3">
              <div className="text-xs uppercase tracking-wider text-simea-muted mb-1">Mínimo</div>
              <div className="text-lg font-bold mono">
                {stats.min !== null ? stats.min.toFixed(3) : '—'} <span className="text-xs text-simea-muted">{props.unidad}</span>
              </div>
            </div>
            <div className="bg-simea-card border border-simea-border rounded-xl p-3">
              <div className="text-xs uppercase tracking-wider text-simea-muted mb-1">Máximo</div>
              <div className="text-lg font-bold mono">
                {stats.max !== null ? stats.max.toFixed(3) : '—'} <span className="text-xs text-simea-muted">{props.unidad}</span>
              </div>
            </div>
          </div>

          {/* Gráfico ampliado */}

            titulo={props.titulo}
            datos={props.datos}

            unidad={props.unidad}
            valorActual={props.valorActual}
            rangoMinutos={props.rangoMinutos}

          />

          {/* Acciones */}
          <div className="mt-4 flex items-center justify-between text-xs text-simea-muted">
            <div>{stats.muestras} muestras · Rango: {props.rangoLabel || '—'}</div>
            <button
              onClick={descargarCSV}
              className="px-3 py-1.5 rounded-lg bg-simea-card border border-simea-border hover:border-simea-accent/40 hover:text-simea-text transition flex items-center gap-2"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>

}

        setSerie(results[1].datos || []);
        setModelo(results[2]);
        setPatron(results[3]);
        setAlertasActivas(results[4].alertas || []);
        setError(null);
      }).catch(function(e) {
        if (activo) setError(e.message);
      });
    }
    cargar();
    const interval = setInterval(cargar, POLLING_MS);
    return function() { activo = false; clearInterval(interval); };
  }, [props.token, rangoMinutos]);

  const seriePotencia = serie.map(function(d) { return { timestamp: d.timestamp, valor: d.potencia_kw }; });
  const serieCorriente = serie.map(function(d) { return { timestamp: d.timestamp, valor: d.corriente_a }; });
  const serieFP = serie.map(function(d) { return { timestamp: d.timestamp, valor: d.factor_potencia }; });

  // Ordenar las bandas de tolerancia por potencia media para mostrarlas
  const estadosOrdenados = modelo && modelo.bandas_tolerancia
    ? modelo.bandas_tolerancia.slice().sort(function(a, b) { return a.potencia_media - b.potencia_media; })
    : [];

  // Verificar si hay curva patrón disponible.
  // La fuente de verdad es `modelo.es_ciclico`, que se determina automáticamente
  // al entrenar. Un modelo cíclico tiene curva patrón asociada; uno no cíclico no.
  const hayCurvaPatron = patron && patron.puntos && patron.puntos.length > 0;
  const modeloEsCiclico = modelo && modelo.es_ciclico === true;

  // Opciones del filtro de tiempo
  const rangosTiempo = [
    { label: 'Última hora', valor: 60, agregacion: null },
    { label: 'Últimas 6 horas', valor: 360, agregacion: '10s' },
    { label: 'Últimas 24 horas', valor: 1440, agregacion: '1m' },
    { label: 'Últimos 7 días', valor: 10080, agregacion: '10m' },
  ];

  const modoActual = (props.estado && props.estado.modo) || 'inactivo';
  const hayModeloActivo = modelo !== null;

  function iniciarMonitoreo() {
    setMonitoreoAccion(true);
    setMonitoreoError('');
    api.post('/api/equipos/' + EQUIPO_ID + '/monitoreo/iniciar', props.token, {})
      .then(function() {
        if (props.recargarEstado) props.recargarEstado();
      })
      .catch(function(e) { setMonitoreoError(e.message); })
      .finally(function() { setMonitoreoAccion(false); });
  }

  function detenerMonitoreo() {
    setMonitoreoAccion(true);
    setMonitoreoError('');
    api.post('/api/equipos/' + EQUIPO_ID + '/monitoreo/detener', props.token)
      .then(function() {
        if (props.recargarEstado) props.recargarEstado();
      })
      .catch(function(e) { setMonitoreoError(e.message); })
      .finally(function() { setMonitoreoAccion(false); });
  }

  return (
    <div className="space-y-6">
      {/* Header contextual: modo del sistema + selector de equipo */}
      <Card className="p-5">
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          {/* Modo actual del sistema */}
          <div className="flex items-center gap-4">
            <div className="flex items-center justify-center flex-shrink-0" style={{ width: "80px", height: "80px" }}>
              <div className="relative">
                <div className={"w-14 h-14 rounded-full flex items-center justify-center " + (
                  (props.estado && props.estado.modo === 'monitoreo') ? "bg-emerald-500/10 border-2 border-emerald-500/40" :
                  (props.estado && props.estado.modo === 'aprendizaje') ? "bg-blue-500/10 border-2 border-blue-500/40" :
                  "bg-simea-border border-2 border-simea-border"
                )}>
                  <div className={"w-3 h-3 rounded-full pulse-dot " + (
                    (props.estado && props.estado.modo === 'monitoreo') ? "bg-simea-ok" :
                    (props.estado && props.estado.modo === 'aprendizaje') ? "bg-simea-accent2" :
                    "bg-simea-muted"
                  )}></div>
                </div>
              </div>
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-xs uppercase tracking-wider text-simea-muted">Modo del sistema</div>
              <div className="text-lg font-semibold capitalize mt-0.5">
                {(props.estado && props.estado.modo) || 'Inactivo'}
              </div>
              {props.estado && props.estado.sesion && (
                <div className="text-xs text-simea-muted mt-0.5 truncate">
                  Iniciado por {props.estado.sesion.usuario} · {formatearFechaHora(props.estado.sesion.fecha_inicio)}
                </div>
              )}
              {/* Botones de control de monitoreo */}
              <div className="mt-3">
                {modoActual === 'inactivo' && (
                  <Button
                    onClick={iniciarMonitoreo}
                    disabled={monitoreoAccion || !hayModeloActivo}
                    variant="primary"
                    className="text-xs"
                  >
                    {monitoreoAccion ? 'Iniciando...' : 'Iniciar monitoreo'}
                  </Button>
                )}
                {modoActual === 'monitoreo' && (
                  <Button
                    onClick={detenerMonitoreo}
                    disabled={monitoreoAccion}
                    variant="danger"
                    className="text-xs"
                  >
                    {monitoreoAccion ? 'Deteniendo...' : 'Detener monitoreo'}
                  </Button>
                )}
                {modoActual === 'aprendizaje' && (
                  <div className="text-xs text-simea-muted italic">
                    Sistema en aprendizaje. Finalícelo desde la pestaña Aprendizaje.
                  </div>
                )}
                {modoActual === 'inactivo' && !hayModeloActivo && (
                  <div className="text-xs text-amber-300 mt-1">
                    No hay modelo activo. Entrene uno primero.
                  </div>
                )}
                {monitoreoError && (
                  <div className="text-xs text-red-400 mt-1">{monitoreoError}</div>
                )}
              </div>
            </div>
          </div>

          {/* Selector de equipo */}
          <div className="md:border-l md:border-simea-border md:pl-5 flex items-center gap-4">
            <div className="flex items-center justify-center flex-shrink-0 rounded-full bg-simea-card border border-simea-border" style={{ width: "56px", height: "56px" }}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8C95A4" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                <circle cx="12" cy="12" r="4"/>
              </svg>
            </div>
            <div className="flex-1">
              <div className="text-xs uppercase tracking-wider text-simea-muted">Equipo monitoreado</div>
              <select
                className="mt-1 w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-1.5 text-sm font-medium focus:border-simea-accent focus:outline-none cursor-pointer"
                value={props.equipo ? props.equipo.id : ''}
                onChange={function(e) {
                  if (props.onCambiarEquipo) {
                    props.onCambiarEquipo(e.target.value);
                  }
                }}
              >
                {(props.equiposDisponibles || []).map(function(eq) {
                  return <option key={eq.id} value={eq.id}>{eq.nombre}</option>;
                })}
              </select>
              {modelo && modelo.es_ciclico !== null && modelo.es_ciclico !== undefined && (
                <div className="text-xs text-simea-muted mt-1 capitalize">
                  Operación detectada: {modelo.es_ciclico ? 'cíclica' : 'continua'}
                </div>
              )}
            </div>
          </div>
        </div>
      </Card>

      {/* Filtro de tiempo para los gráficos */}
      <div className="flex items-center gap-2">
        <label className="text-xs uppercase tracking-wider text-simea-muted">Rango:</label>
        <select
          value={rangoMinutos}
          onChange={function(e) { setRangoMinutos(parseInt(e.target.value)); }}
          className="bg-simea-card border border-simea-border rounded-lg px-3 py-1.5 text-sm text-simea-text focus:outline-none focus:border-simea-accent transition"
        >
          {rangosTiempo.map(function(r) {
            return <option key={r.valor} value={r.valor}>{r.label}</option>;
          })}
        </select>
      </div>

      {/* Mediciones en tiempo real: gráfica unificada con solapas + gauge FP */}
      <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
        <div className="lg:col-span-4">
          <MultiSeriesChart
            seriePotencia={seriePotencia}
            serieCorriente={serieCorriente}
            serieFP={serieFP}
            datosActuales={datosActuales}
            rangoMinutos={rangoMinutos}
            onExpandir={function(variable) { setDetalleGrafico(variable); }}
          />
        </div>
        <div className="lg:col-span-1">
          <Card className="p-5 h-full flex items-center justify-center">
            <GaugeFP valor={datosActuales ? datosActuales.factor_potencia : 0} />
          </Card>
        </div>
      </div>

      {/* Modal de detalle */}
      <GraficoDetalleModal
        abierto={detalleGrafico === 'potencia'}
        onCerrar={function() { setDetalleGrafico(null); }}
        titulo="Potencia activa"
        datos={seriePotencia}
        color="#60A5FA"
        unidad="kW"
        valorActual={datosActuales ? datosActuales.potencia_kw : null}
        rangoLabel={rangosTiempo.find(function(r) { return r.valor === rangoMinutos; }).label}
        rangoMinutos={rangoMinutos}
      />
      <GraficoDetalleModal
        abierto={detalleGrafico === 'corriente'}
        onCerrar={function() { setDetalleGrafico(null); }}
        titulo="Corriente"
        datos={serieCorriente}
        color="#10B981"
        unidad="A"
        valorActual={datosActuales ? datosActuales.corriente_a : null}
        rangoLabel={rangosTiempo.find(function(r) { return r.valor === rangoMinutos; }).label}
        rangoMinutos={rangoMinutos}
      />
      <GraficoDetalleModal
        abierto={detalleGrafico === 'fp'}
        onCerrar={function() { setDetalleGrafico(null); }}
        titulo="Factor de potencia"
        datos={serieFP}
        color="#F59E0B"
        unidad=""
        valorActual={datosActuales ? datosActuales.factor_potencia : null}
        rangoLabel={rangosTiempo.find(function(r) { return r.valor === rangoMinutos; }).label}
        rangoMinutos={rangoMinutos}
      />

      {/* Modelo activo con sus estados operativos */}
      {modelo && estadosOrdenados.length > 0 && (
        <Card className="p-5">
          <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
            {/* Métrica: Modelo activo (izquierda, ocupa 1/4) */}
            <div className="lg:border-r lg:border-simea-border lg:pr-6 flex flex-col justify-center items-center text-center py-2">
              <div className="text-xs uppercase tracking-wider text-simea-muted mb-3">Modelo activo</div>
              <div className="flex items-center justify-center gap-2 mb-2">
                <span className="text-5xl font-bold mono text-simea-accent2 leading-none">#{modelo.id_modelo}</span>
              </div>
              <div className="flex items-baseline gap-2 mt-3">
                <span className="text-2xl font-bold mono">{modelo.k_optimo}</span>
                <span className="text-sm text-simea-muted">estados operativos</span>
              </div>
              <div className="text-xs text-simea-muted mt-3">
                Entrenado el {formatearFechaHora(modelo.fecha_entrenamiento)}
              </div>
            </div>

            {/* Tabla: Estados operativos (derecha, ocupa 3/4) */}
            <div className="lg:col-span-3">
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-xs font-medium text-simea-muted uppercase tracking-wider">Estados operativos identificados</h3>
                <span className="text-xs text-simea-muted">Valores medios ± desvío</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="border-b border-simea-border">
                      <th className="text-left text-xs uppercase tracking-wider text-simea-muted font-medium py-2 pr-4">Estado</th>
                      <th className="text-right text-xs uppercase tracking-wider text-simea-muted font-medium py-2 pr-4">Potencia (kW)</th>
                      <th className="text-right text-xs uppercase tracking-wider text-simea-muted font-medium py-2 pr-4">Corriente (A)</th>
                      <th className="text-right text-xs uppercase tracking-wider text-simea-muted font-medium py-2">Muestras</th>
                    </tr>
                  </thead>
                  <tbody>
                    {estadosOrdenados.map(function(e, idx) {
                      return (
                        <tr key={e.cluster_id} className="border-b border-simea-border last:border-0">
                          <td className="py-2.5 pr-4">
                            <span className="mono text-simea-muted">#{idx + 1}</span>
                          </td>
                          <td className="py-2.5 pr-4 text-right mono">
                            {e.potencia_media.toFixed(3)} <span className="text-simea-muted text-xs">± {e.potencia_desvio.toFixed(3)}</span>
                          </td>
                          <td className="py-2.5 pr-4 text-right mono">
                            {e.corriente_media.toFixed(3)} <span className="text-simea-muted text-xs">± {e.corriente_desvio.toFixed(3)}</span>
                          </td>
                          <td className="py-2.5 text-right mono text-simea-muted">{e.cantidad_muestras}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </Card>
      )}

      {modeloEsCiclico && hayCurvaPatron && (
        <CurvaPatronChart puntos={patron.puntos} />
      )}
      {error && (
        <div className="text-sm text-red-400 bg-red-950/40 border border-red-900 rounded-lg px-3 py-2">
          {error}
        </div>
      )}
    </div>
  );
}

function AprendizajeView(props) {
  const [notas, setNotas] = useState('');
  const [mensaje, setMensaje] = useState('');
  const [error, setError] = useState('');
  const [cargando, setCargando] = useState(false);
  const [tiempoTranscurrido, setTiempoTranscurrido] = useState(0);
  const [mostrarConfirmacionCorta, setMostrarConfirmacionCorta] = useState(false);
  const [tab, setTab] = useState('nueva_sesion');

  const enAprendizaje = props.estado && props.estado.modo === 'aprendizaje';
  const enMonitoreo = props.estado && props.estado.modo === 'monitoreo';

  // Recomendación genérica de tiempo de aprendizaje.
  // Ya no depende del tipo de operación del equipo (el sistema detectará
  // automáticamente si es cíclico o continuo). Se usan los tiempos que
  // el usuario configuró al registrar el equipo; si no los tiene, se
  // aplica un default razonable.
  const rec = {
    minimo: (props.equipo && props.equipo.tiempo_minimo_aprendizaje) || 30,
    ideal: (props.equipo && props.equipo.tiempo_recomendado_aprendizaje) || 60,
    descripcion: 'Cuanto más largo el aprendizaje, mejor caracterizará el comportamiento normal del equipo. Para equipos con ciclos repetitivos, procurar cubrir al menos 3 ciclos completos.',
  };

  // Actualizar contador de tiempo transcurrido durante el aprendizaje
  useEffect(function() {
    if (!enAprendizaje || !props.estado || !props.estado.sesion) {
      setTiempoTranscurrido(0);
      return;
    }
    function actualizar() {
      const inicio = new Date(props.estado.sesion.fecha_inicio);
      const ahora = new Date();
      setTiempoTranscurrido(Math.floor((ahora - inicio) / 1000));
    }
    actualizar();
    const interval = setInterval(actualizar, 1000);
    return function() { clearInterval(interval); };
  }, [enAprendizaje, props.estado]);

  function formatearDuracion(segundos) {
    const h = Math.floor(segundos / 3600);
    const m = Math.floor((segundos % 3600) / 60);
    const s = segundos % 60;
    if (h > 0) return h + 'h ' + m + 'min ' + s + 's';
    if (m > 0) return m + 'min ' + s + 's';
    return s + 's';
  }

  const minutosTranscurridos = Math.floor(tiempoTranscurrido / 60);
  const cumpleMinimo = minutosTranscurridos >= rec.minimo;
  const cumpleIdeal = minutosTranscurridos >= rec.ideal;

  function iniciar() {
    setCargando(true); setMensaje(''); setError('');
    api.post('/api/equipos/' + EQUIPO_ID + '/aprendizaje/iniciar', props.token, { notas: notas || null })
      .then(function() {
        setMensaje('Aprendizaje iniciado correctamente');
        setNotas('');
        return props.recargarEstado();
      })
      .catch(function(e) { setError(e.message); })
      .finally(function() { setCargando(false); });
  }

  function finalizarConfirmado() {
    setCargando(true); setMensaje(''); setError(''); setMostrarConfirmacionCorta(false);
    api.post('/api/equipos/' + EQUIPO_ID + '/aprendizaje/finalizar', props.token)
      .then(function(r) {
        setMensaje('Aprendizaje finalizado. Entrenamiento en proceso (PID ' + r.pid_entrenamiento + ').');
        return props.recargarEstado();
      })
      .catch(function(e) { setError(e.message); })
      .finally(function() { setCargando(false); });
  }

  function intentarFinalizar() {
    if (!cumpleMinimo) {
      setMostrarConfirmacionCorta(true);
    } else {
      finalizarConfirmado();
    }
  }

  return (
    <div className="space-y-6">

      <div className="flex gap-2 border-b border-simea-border">
        <button
          onClick={function() { setTab('nueva_sesion'); }}
          className={"px-4 py-2.5 text-sm font-medium transition border-b-2 -mb-px " + (
            tab === 'nueva_sesion'
              ? "text-simea-accent2 border-simea-accent"
              : "text-simea-muted border-transparent hover:text-simea-text"
          )}
        >
          Nueva sesión de aprendizaje
        </button>
        <button
          onClick={function() { setTab('modelos_entrenados'); }}
          className={"px-4 py-2.5 text-sm font-medium transition border-b-2 -mb-px " + (
            tab === 'modelos_entrenados'
              ? "text-simea-accent2 border-simea-accent"
              : "text-simea-muted border-transparent hover:text-simea-text"
          )}
        >
          Modelos entrenados
        </button>
      </div>

      {tab === 'nueva_sesion' && (
      <Card className="p-6">
        <div className="flex items-center justify-between mb-6">
          <div>
            <div className="text-xs uppercase tracking-wider text-simea-muted mb-1">
              Aprendizaje para: <span className="text-simea-text font-medium">{props.equipo ? props.equipo.nombre : '—'}</span>
            </div>
            <div className="flex items-center gap-3">
              <StatusDot status={(props.estado && props.estado.modo) || 'inactivo'} />
              <span className="text-lg font-semibold capitalize">{(props.estado && props.estado.modo) || 'Inactivo'}</span>
            </div>
          </div>
          {props.estado && props.estado.sesion && (
            <div className="text-right text-sm">
              <div className="text-simea-muted">Iniciado</div>
              <div className="mono">{formatearFechaHora(props.estado.sesion.fecha_inicio)}</div>
              <div className="text-simea-muted mt-1">Por {props.estado.sesion.usuario}</div>
            </div>
          )}
        </div>

        {!enAprendizaje && !enMonitoreo && (
          <div>
            <div className="bg-simea-bg/50 border border-simea-border rounded-lg p-4 mb-4">
              <div className="text-xs uppercase tracking-wider text-simea-muted mb-2">Recomendación para este equipo</div>
              <div className="text-sm text-simea-muted mb-3">{rec.descripcion}</div>
              <div className="flex gap-4 text-xs">
                <div>
                  <span className="text-simea-muted">Mínimo:</span>{' '}
                  <span className="mono font-medium">{rec.minimo} min</span>
                </div>
                <div>
                  <span className="text-simea-muted">Recomendado:</span>{' '}
                  <span className="mono font-medium">{rec.ideal} min</span>
                </div>
              </div>
            </div>
            <div className="mb-4">
              <label className="block text-xs font-medium text-simea-muted mb-1.5 uppercase tracking-wider">
                Notas de la sesión (opcional)
              </label>
              <textarea
                value={notas}
                onChange={function(e) { setNotas(e.target.value); }}
                rows={3}
                placeholder="Ej: Aprendizaje inicial con carga de cajas estándar a velocidad normal"
                className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2.5 text-simea-text focus:outline-none focus:border-simea-accent transition resize-none"
              />
            </div>
            <Button onClick={iniciar} disabled={cargando}>
              {cargando ? 'Iniciando...' : 'Iniciar aprendizaje'}
            </Button>
          </div>
        )}

        {enAprendizaje && (
          <div className="space-y-4">
            <div className="bg-blue-950/40 border border-blue-900 rounded-lg p-4">
              <div className="flex items-center justify-between mb-3">
                <div>
                  <div className="text-xs uppercase tracking-wider text-blue-300 mb-1">Tiempo transcurrido</div>
                  <div className="text-2xl font-bold mono">{formatearDuracion(tiempoTranscurrido)}</div>
                </div>
                <div className="text-right">
                  <div className="text-xs text-simea-muted mb-1">Progreso recomendado</div>
                  {cumpleIdeal ? (
                    <Badge color="ok">Óptimo</Badge>
                  ) : cumpleMinimo ? (
                    <Badge color="warn">Suficiente</Badge>
                  ) : (
                    <Badge color="crit">Insuficiente</Badge>
                  )}
                </div>
              </div>
              <div className="w-full bg-simea-bg rounded-full h-2 overflow-hidden">
                <div
                  className={"h-full transition-all duration-500 " + (
                    cumpleIdeal ? "bg-emerald-500" :
                    cumpleMinimo ? "bg-amber-500" :
                    "bg-red-500"
                  )}
                  style={{ width: Math.min(100, (minutosTranscurridos / rec.ideal) * 100) + '%' }}
                />
              </div>
              <div className="flex justify-between text-xs text-simea-muted mt-2 mono">
                <span>0 min</span>
                <span>{rec.minimo} min (mín)</span>
                <span>{rec.ideal} min (rec)</span>
              </div>
            </div>

            <div className="bg-simea-bg/50 border border-simea-border rounded-lg p-3 text-sm text-simea-muted">
              {rec.descripcion}
            </div>

            <Button onClick={intentarFinalizar} disabled={cargando} variant="primary">
              {cargando ? 'Finalizando...' : 'Finalizar aprendizaje y entrenar'}
            </Button>
          </div>
        )}

        {enMonitoreo && (
          <div className="bg-emerald-950/40 border border-emerald-900 rounded-lg px-4 py-3 text-sm text-emerald-200">
            El sistema está actualmente en modo monitoreo. Para volver a entrenar, primero detenga el monitoreo desde su sección correspondiente.
          </div>
        )}

        {mostrarConfirmacionCorta && (
          <div className="mt-4 bg-amber-950/40 border border-amber-800 rounded-lg p-4">
            <div className="flex items-start gap-3 mb-3">
              <div className="text-amber-400 text-xl">⚠</div>
              <div className="flex-1">

function MonitoreoView(props) {
  const [alertas, setAlertas] = useState([]);
  const [mensaje, setMensaje] = useState('');
  const [error, setError] = useState('');
  const [cargando, setCargando] = useState(false);
  const [reconociendo, setReconociendo] = useState(null);
  const [descripcion, setDescripcion] = useState('');

  const enMonitoreo = props.estado && props.estado.modo === 'monitoreo';
  const enAprendizaje = props.estado && props.estado.modo === 'aprendizaje';

  useEffect(function() {
    let activo = true;
    function cargar() {
      api.get('/api/equipos/' + EQUIPO_ID + '/alertas?estado=pendiente&minutos=120', props.token)
        .then(function(r) { if (activo) setAlertas(r.alertas || []); })
        .catch(function(e) { if (activo) setError(e.message); });
    }
    cargar();
    const interval = setInterval(cargar, POLLING_MS);
    return function() { activo = false; clearInterval(interval); };
  }, [props.token, props.estado]);

  function iniciar() {
    setCargando(true); setMensaje(''); setError('');
    api.post('/api/equipos/' + EQUIPO_ID + '/monitoreo/iniciar', props.token, {})
      .then(function() {
        setMensaje('Monitoreo iniciado correctamente');
        return props.recargarEstado();
      })
      .catch(function(e) { setError(e.message); })
      .finally(function() { setCargando(false); });
  }

  function detener() {
    setCargando(true); setMensaje(''); setError('');
    api.post('/api/equipos/' + EQUIPO_ID + '/monitoreo/detener', props.token)
      .then(function() {
        setMensaje('Monitoreo detenido');
        return props.recargarEstado();
      })
      .catch(function(e) { setError(e.message); })
      .finally(function() { setCargando(false); });
  }

  function reconocer(timestamp) {
    if (!descripcion.trim()) {
      setError('La descripción no puede estar vacía');
      return;
    }
    api.post(
      '/api/equipos/' + EQUIPO_ID + '/alertas/reconocer?timestamp=' + encodeURIComponent(timestamp),
      props.token,
      { descripcion: descripcion }
    )
      .then(function() {
        setReconociendo(null);
        setDescripcion('');
        setMensaje('Alerta reconocida');
        return api.get('/api/equipos/' + EQUIPO_ID + '/alertas?estado=pendiente&minutos=120', props.token);
      })
      .then(function(r) { setAlertas(r.alertas || []); })
      .catch(function(e) { setError(e.message); });

    'CRITICA': 'crit',
    'ALERTA': 'high',
    'AVISO': 'warn',

        </p>
      </div>
      <Card className="p-6">
        <div className="flex items-center justify-between mb-4">
          <div>
            <div className="text-xs uppercase tracking-wider text-simea-muted mb-1">Estado actual</div>
            <div className="flex items-center gap-3">
              <StatusDot status={(props.estado && props.estado.modo) || 'inactivo'} />
              <span className="text-lg font-semibold capitalize">{(props.estado && props.estado.modo) || 'Inactivo'}</span>
            </div>
          </div>
          {!enMonitoreo && !enAprendizaje && (
            <Button onClick={iniciar} disabled={cargando}>
              {cargando ? 'Iniciando...' : 'Iniciar monitoreo'}
            </Button>
          )}
          {enMonitoreo && (
            <Button onClick={detener} disabled={cargando} variant="danger">
              {cargando ? 'Deteniendo...' : 'Detener monitoreo'}
            </Button>
          )}
        </div>
        {enAprendizaje && (
          <div className="bg-blue-950/40 border border-blue-900 rounded-lg px-4 py-3 text-sm text-blue-200">
            El sistema está en modo aprendizaje. Finalícelo antes de iniciar el monitoreo.
          </div>
        )}
        {mensaje && (
          <div className="mt-2 bg-emerald-950/40 border border-emerald-900 rounded-lg px-3 py-2 text-sm text-emerald-200">
            {mensaje}
          </div>
        )}
        {error && (
          <div className="mt-2 bg-red-950/40 border border-red-900 rounded-lg px-3 py-2 text-sm text-red-300">
            {error}
          </div>
        )}
      </Card>

      <div>
        <h2 className="text-lg font-semibold mb-3">Alertas pendientes ({alertas.length})</h2>
        {alertas.length === 0 ? (
          <Card className="p-8 text-center text-simea-muted">
            <div className="text-4xl mb-2">✓</div>
            <div className="text-sm">No hay alertas pendientes</div>
          </Card>
        ) : (
          <div className="space-y-3">
            {alertas.map(function(a) {
              return (
                <Card key={a.timestamp} className="p-5">
                  <div className="flex items-start justify-between gap-4">
                    <div className="flex-1">
                      <div className="flex items-center gap-2 mb-2">

                      </div>
                      <div className="text-sm font-medium mb-2">{a.firma}</div>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs text-simea-muted">

                        <div>I: <span className="mono text-simea-text">{a.corriente_a} A</span> <span className="text-simea-muted">(Δ{a.desvio_corriente}σ)</span></div>

                  {reconociendo === a.timestamp && (
                    <div className="mt-4 pt-4 border-t border-simea-border space-y-3">
                      <textarea
                        value={descripcion}
                        onChange={function(e) { setDescripcion(e.target.value); }}

                        placeholder="Describa la causa de la alerta o las acciones tomadas..."
                        className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-simea-accent transition resize-none"
                        autoFocus

                      <div className="flex gap-2">

                        <Button variant="ghost" onClick={function() { setReconociendo(null); setDescripcion(''); }}>

  function recargar() {

    // Cuando el filtro de tiempo es null ("Todas"), no enviamos el parámetro minutos:

    const paramTiempo = filtroTiempo !== null ? 'minutos=' + filtroTiempo : '';

    // Decidir qué equipos consultar
    const equiposAConsultar = filtroEquipo === 'todos'
      ? equipos
      : equipos.filter(function(eq) { return eq.id === filtroEquipo; });

    if (equiposAConsultar.length === 0) {
      setAlertas([]);
      setCargando(false);
      return;
    }

    // Consultar en paralelo las alertas de cada equipo, incorporando su nombre
    Promise.all(equiposAConsultar.map(function(eq) {

    }))
    .then(function(resultados) {
      const todas = [];
      resultados.forEach(function(arr) { arr.forEach(function(a) { todas.push(a); }); });
      // Ordenar de más reciente a más antigua
      todas.sort(function(a, b) {
        return new Date(b.timestamp) - new Date(a.timestamp);
      });
      setAlertas(todas);
    })
    .finally(function() { setCargando(false); });
  }

  useEffect(function() {
    recargar();
  }, [props.token, filtro, filtroEquipo, filtroTiempo, equipos.length]);

  // Refresco silencioso: recarga los datos sin mostrar el mensaje "Cargando..."
  // React preserva el estado de los elementos que no cambiaron (mediante key={a.timestamp}),
  // por lo que las alertas expandidas mantienen su estado.
  function recargarSilencioso() {
    setRefrescando(true);
    const estadoParam = filtro === 'todas' ? '' : 'estado=' + filtro + '&';
    // Cuando el filtro de tiempo es null ("Todas"), no enviamos el parámetro minutos.
    const paramTiempo = filtroTiempo !== null ? 'minutos=' + filtroTiempo : '';

    const equiposAConsultar = filtroEquipo === 'todos'

      return api.get('/api/equipos/' + eq.id + '/alertas?' + estadoParam + paramTiempo, props.token)
        .then(function(r) {
          return (r.alertas || []).map(function(a) {
            return Object.assign({}, a, { equipo_id: eq.id, equipo_nombre: eq.nombre });
          });
        })
        .catch(function(e) { console.error('Error refrescando alertas de ' + eq.id, e); return []; });
    }))
    .then(function(resultados) {
      const todas = [];
      resultados.forEach(function(arr) { arr.forEach(function(a) { todas.push(a); }); });
      todas.sort(function(a, b) {
        return new Date(b.timestamp) - new Date(a.timestamp);
      });
      setAlertas(todas);
    })
    .finally(function() { setRefrescando(false); });
  }

  function reconocer(timestamp, equipoId) {
    setReconocAccion(true);
    setError('');
    const eq = equipoId || EQUIPO_ID;
    api.post(
      '/api/equipos/' + eq + '/alertas/reconocer?timestamp=' + encodeURIComponent(timestamp),
      props.token,
      { descripcion: descripcionReconoc }
    )
      .then(function() {
        setReconociendo(null);
        setDescripcionReconoc('');
        recargar();
      })
      .catch(function(e) { setError(e.message); })
      .finally(function() { setReconocAccion(false); });
  }

  function descargarCSV(archivadas) {
    if (!archivadas || archivadas.length === 0) return;

    const encabezados = [
      'equipo_id', 'equipo_nombre',
      'timestamp', 'severidad', 'firma',
      'potencia_kw', 'corriente_a', 'factor_potencia',
      'desvio_potencia', 'desvio_corriente', 'desvio_fp', 'desvio_maximo',
      'cluster_id', 'score_iforest',
      'descripcion_reconocimiento', 'usuario_reconocimiento', 'fecha_reconocimiento'
    ];

    // Campos numéricos que necesitan formato regional (coma decimal)
    const camposNumericos = [
      'potencia_kw', 'corriente_a', 'factor_potencia',
      'desvio_potencia', 'desvio_corriente', 'desvio_fp', 'desvio_maximo',
      'score_iforest'
    ];

    // Campos de fecha/hora que se convierten a hora local
    const camposFecha = ['timestamp', 'fecha_reconocimiento'];

    // Convierte un ISO UTC a formato local "YYYY-MM-DD HH:MM:SS"
    function toHoraLocal(isoUtc) {
      const d = new Date(isoUtc);
      if (isNaN(d.getTime())) return isoUtc; // por si viene algo raro
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      return yyyy + '-' + mm + '-' + dd + ' ' + hh + ':' + mi + ':' + ss;
    }

    function escapar(valor, esNumerico, esFecha) {
      if (valor === null || valor === undefined) return '';
      let str = String(valor);
      // Convertir fechas UTC a hora local
      if (esFecha) {
        str = toHoraLocal(str);
      }
      // Para campos numéricos, convertir punto decimal a coma decimal (formato AR)
      if (esNumerico && !isNaN(parseFloat(str))) {
        str = str.replace('.', ',');
      }
      // Escapar valores que contengan el separador de campos (;), comillas o saltos de línea
      if (str.indexOf(';') !== -1 || str.indexOf('"') !== -1 || str.indexOf('\n') !== -1) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }

    const filas = archivadas.map(function(a) {
      return encabezados.map(function(h) {
        return escapar(
          a[h],
          camposNumericos.indexOf(h) !== -1,
          camposFecha.indexOf(h) !== -1
        );
      }).join(';');
    });

    // BOM UTF-8 para que Excel reconozca acentos correctamente
    const BOM = '\uFEFF';
    // "sep=;" es una directiva que Excel reconoce para usar ; como separador
    const csv = BOM + 'sep=;\n' + encabezados.join(';') + '\n' + filas.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

    const ahora = new Date();
    const yyyy = ahora.getFullYear();
    const mm = String(ahora.getMonth() + 1).padStart(2, '0');
    const dd = String(ahora.getDate()).padStart(2, '0');
    const hh = String(ahora.getHours()).padStart(2, '0');
    const mi = String(ahora.getMinutes()).padStart(2, '0');
    const ss = String(ahora.getSeconds()).padStart(2, '0');
    const sufijoEquipo = filtroEquipo === 'todos' ? 'todos' : filtroEquipo;
    const nombreArchivo = 'alertas_archivadas_' + sufijoEquipo + '_' + yyyy + mm + dd + '_' + hh + mi + ss + '.csv';

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function archivarReconocidas() {
    setArchivando(true);
    setError('');
    setMensaje('');

    // Determinar qué equipos archivar según el filtro
    const equiposAArchivar = filtroEquipo === 'todos'
      ? equipos
      : equipos.filter(function(eq) { return eq.id === filtroEquipo; });

    Promise.all(equiposAArchivar.map(function(eq) {
      return api.post('/api/equipos/' + eq.id + '/alertas/archivar', props.token)
        .then(function(r) {
          return { equipo: eq, archivadas: r.archivadas || [], cantidad: r.cantidad || 0 };
        })
        .catch(function(e) { console.error('Error archivando ' + eq.id, e); return { equipo: eq, archivadas: [], cantidad: 0 }; });
    }))
    .then(function(resultados) {
      const totalArchivadas = resultados.reduce(function(sum, r) { return sum + r.cantidad; }, 0);
      if (totalArchivadas === 0) {
        setMensaje('No hay alertas reconocidas para archivar');
      } else {
        // Unificar todas las archivadas en un solo CSV agregando el equipo
        const todas = [];
        resultados.forEach(function(r) {
          r.archivadas.forEach(function(a) {
            todas.push(Object.assign({}, a, { equipo_id: r.equipo.id, equipo_nombre: r.equipo.nombre }));
          });
        });
        descargarCSV(todas);
        setMensaje('Se archivaron ' + totalArchivadas + ' alertas. Archivo CSV descargado.');
        recargar();
      }
      setMostrarConfirmacion(false);
      setTextoConfirmacion('');
    })
    .catch(function(e) { setError(e.message); })
    .finally(function() { setArchivando(false); });
  }

  function eliminarAlerta(timestamp, equipoId) {
    if (!window.confirm('¿Está seguro de eliminar esta alerta? Esta acción no se puede deshacer.')) return;
    const eq = equipoId || EQUIPO_ID;
    api.delete = api.delete || function(path, token) {
      return fetch(API_BASE + path, {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + token },
      }).then(function(r) {
        if (!r.ok) {
          return r.json().catch(function() { return { detail: 'Error' }; })
            .then(function(err) { throw new Error(err.detail || 'Error'); });
        }
        return r.json();
      });
    };
    api.delete('/api/equipos/' + eq + '/alertas/' + encodeURIComponent(timestamp), props.token)
      .then(function() {
        setMensaje('Alerta eliminada');
        recargar();
      })
      .catch(function(e) { setError(e.message); });
  }

  const colorSeveridad = {
    'CRITICA': 'crit',
    'ALERTA': 'high',
    'AVISO': 'warn',
  };

  // -----------------------------------------------------------------------
  // Funciones auxiliares para el detalle de anomalías (Nivel 2 y 3)
  // -----------------------------------------------------------------------

  // Obtiene la banda del cluster asignado a una alerta.
  // El monitor renumera los clusters ordenándolos por potencia_media, empezando
  // desde 1 (menor consumo) hasta N (mayor consumo). Esta función replica ese
  // mapeo para encontrar la banda correcta correspondiente al cluster_id de
  // la alerta.
  function bandaDeCluster(clusterId, equipoId) {
    // bandas es un objeto indexado por equipo_id, cada valor es un array de bandas
    const bandasEquipo = bandas && equipoId ? (bandas[equipoId] || []) : [];
    if (bandasEquipo.length === 0) return null;
    // Ordenar bandas por potencia_media ascendente
    const ordenadas = bandasEquipo.slice().sort(function(a, b) {
      return a.potencia_media - b.potencia_media;
    });
    // El cluster_id renumerado empieza en 1
    const indice = clusterId - 1;
    if (indice < 0 || indice >= ordenadas.length) return null;
    return ordenadas[indice];
  }

  // Clasifica la magnitud del desvío según sigmas
  function clasificarMagnitud(sigmas) {
    if (sigmas < 2.0) return 'normal';
    if (sigmas < 3.0) return 'leve';
    if (sigmas < 5.0) return 'significativo';
    return 'marcado';
  }

  // Texto para mostrar la categoría
  function textoCategoria(categoria) {
    const mapa = {
      'normal': 'dentro del rango normal',
      'leve': 'leve',
      'significativo': 'significativo',
      'marcado': 'marcado',
    };
    return mapa[categoria] || 'normal';
  }

  // Genera una descripción cualitativa por variable con sentido
  function descripcionVariable(categoria, direccion, variable) {
    if (categoria === 'normal') {
      return variable + ' dentro del rango normal';
    }
    const sentido = direccion > 0 ? 'aumento' : 'caída';
    return sentido.charAt(0).toUpperCase() + sentido.slice(1) + ' ' + textoCategoria(categoria) + ' de ' + variable.toLowerCase();
  }

  // Compone la frase descriptiva a partir de las 3 variables
  function componerDescripcion(alerta, banda) {
    if (!banda) return 'Se detectó una desviación del comportamiento normal aprendido';

    const dirP = alerta.potencia_kw > banda.potencia_media ? 1 : -1;
    const dirI = alerta.corriente_a > banda.corriente_media ? 1 : -1;
    const dirFP = alerta.factor_potencia > banda.fp_media ? 1 : -1;

    const catP = clasificarMagnitud(alerta.desvio_potencia);
    const catI = clasificarMagnitud(alerta.desvio_corriente);
    const catFP = clasificarMagnitud(alerta.desvio_fp);

    const desc = [];

    // Combinar variables con misma categoría/sentido para frases más naturales
    // Ej: "Aumento marcado de potencia y corriente"
    if (catP !== 'normal' && catI !== 'normal' && catP === catI && dirP === dirI) {
      const sentido = dirP > 0 ? 'Aumento' : 'Caída';
      desc.push(sentido + ' ' + textoCategoria(catP) + ' de potencia y corriente');
    } else {
      if (catP !== 'normal') {
        desc.push(descripcionVariable(catP, dirP, 'Potencia'));
      }
      if (catI !== 'normal') {
        desc.push(descripcionVariable(catI, dirI, 'Corriente'));
      }
    }

    if (catFP !== 'normal') {
      desc.push(descripcionVariable(catFP, dirFP, 'Factor de potencia'));
    } else {
      desc.push('Factor de potencia dentro del rango normal');
    }

    return desc.join('. ') + '.';
  }

  // Calcula el porcentaje de desvío respecto al valor esperado
  function porcentajeDesvio(valor, esperado) {
    if (esperado === 0 || esperado === null || esperado === undefined) return 0;
    return ((valor - esperado) / Math.abs(esperado)) * 100;
  }

  // Formatea el porcentaje con signo
  function formatoPorcentaje(pct) {
    const signo = pct >= 0 ? '+' : '';
    return signo + pct.toFixed(1) + '%';
  }

  // Toggle del detalle expandido de una alerta
  function toggleExpansion(timestamp) {
    setAlertaExpandida(function(actual) {
      return actual === timestamp ? null : timestamp;
    });
  }

  // Toggle de los datos técnicos dentro del detalle
  function toggleDatosTecnicos(timestamp) {
    setDatosTecnicosExpandidos(function(actual) {
      const nuevo = Object.assign({}, actual);
      nuevo[timestamp] = !nuevo[timestamp];
      return nuevo;
    });
  }

  // Toggle de las variables medidas dentro del detalle
  function toggleVariablesMedidas(timestamp) {
    setVariablesMedidasExpandidas(function(actual) {
      const nuevo = Object.assign({}, actual);
      nuevo[timestamp] = !nuevo[timestamp];
      return nuevo;
    });
  }

  const cantidadReconocidas = alertas.filter(function(a) { return a.reconocida; }).length;

  return (
    <div className="space-y-6">
      {/* Tabs de estado (Todas / Pendientes / Reconocidas) */}
      <div className="flex gap-2 border-b border-simea-border">
        {[
          { id: 'todas', label: 'Todas' },
          { id: 'pendiente', label: 'Pendientes' },
          { id: 'reconocida', label: 'Reconocidas' },
        ].map(function(f) {
          return (
            <button
              key={f.id}
              onClick={function() { setFiltro(f.id); }}
              className={"px-4 py-2.5 text-sm font-medium transition border-b-2 -mb-px " + (
                filtro === f.id
                  ? "text-simea-accent2 border-simea-accent"
                  : "text-simea-muted border-transparent hover:text-simea-text"
              )}
            >
              {f.label}
            </button>
          );
        })}
      </div>

      {/* Botón de filtros (con popover) + botón actualizar + botón archivar reconocidas */}
      <div className="flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-2 flex-wrap">
          {/* Botón de filtros con indicador de filtros activos */}
          <div className="relative" ref={filtrosPopoverRef}>
            <button
              onClick={function() {
                // Al abrir, sincronizar los valores temporales con los actuales
                if (!filtrosAbierto) {
                  setFiltroEquipoTemp(filtroEquipo);
                  setFiltroTiempoTemp(filtroTiempo);
                }
                setFiltrosAbierto(!filtrosAbierto);
              }}
              className={"flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm bg-simea-card border transition " + (
                filtrosActivos > 0
                  ? "border-simea-accent/50 text-simea-accent2"
                  : "border-simea-border text-simea-muted hover:text-simea-text"
              )}
              title="Filtros"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
              </svg>
              Filtros
              {filtrosActivos > 0 && (
                <span className="ml-1 min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-bold bg-simea-accent text-white flex items-center justify-center">
                  {filtrosActivos}
                </span>
              )}
            </button>

            {/* Popover con los filtros disponibles */}
            {filtrosAbierto && (
              <div className="absolute left-0 mt-2 w-80 bg-simea-card border border-simea-border rounded-xl shadow-2xl z-30 p-4">
                <div className="text-sm font-semibold text-simea-text mb-3">Filtros de alarmas</div>

                {/* Filtro por equipo */}
                <div className="mb-3">
                  <label className="block text-xs uppercase tracking-wider text-simea-muted mb-1.5">Equipo</label>
                  <select
                    value={filtroEquipoTemp}
                    onChange={function(e) { setFiltroEquipoTemp(e.target.value); }}
                    className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm text-simea-text focus:outline-none focus:border-simea-accent transition"
                  >
                    <option value="todos">Todos los equipos</option>
                    {equipos.map(function(eq) {
                      return <option key={eq.id} value={eq.id}>{eq.nombre}</option>;
                    })}
                  </select>
                </div>

                {/* Filtro por rango de tiempo */}
                <div className="mb-4">
                  <label className="block text-xs uppercase tracking-wider text-simea-muted mb-1.5">Rango de tiempo</label>
                  <select
                    value={filtroTiempoTemp === null ? 'todas' : String(filtroTiempoTemp)}
                    onChange={function(e) {
                      const v = e.target.value;
                      setFiltroTiempoTemp(v === 'todas' ? null : parseInt(v));
                    }}
                    className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm text-simea-text focus:outline-none focus:border-simea-accent transition"
                  >
                    {rangosTiempo.map(function(r) {
                      const val = r.valor === null ? 'todas' : String(r.valor);
                      return <option key={val} value={val}>{r.label}</option>;
                    })}
                  </select>
                </div>

                {/* Acciones del popover */}
                <div className="flex items-center justify-between gap-2 pt-3 border-t border-simea-border">
                  <button
                    onClick={function() {
                      setFiltroEquipoTemp('todos');
                      setFiltroTiempoTemp(null);
                    }}
                    className="text-xs text-simea-muted hover:text-simea-text transition"
                  >
                    Limpiar filtros
                  </button>
                  <div className="flex items-center gap-2">
                    <Button variant="ghost" onClick={function() { setFiltrosAbierto(false); }}>
                      Cancelar
                    </Button>
                    <Button onClick={function() {
                      setFiltroEquipo(filtroEquipoTemp);
                      setFiltroTiempo(filtroTiempoTemp);
                      setFiltrosAbierto(false);
                    }}>
                      Aplicar
                    </Button>
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* Botón manual de actualizar (refresco silencioso) */}
          <button

            disabled={refrescando}

            title="Actualizar lista de alertas"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"

              <polyline points="1 20 1 14 7 14"/>

            </div>
          </div>
          <div className="space-y-3">
            <label className="block text-xs font-medium text-simea-muted uppercase tracking-wider">
              Escriba "ARCHIVAR" para confirmar
            </label>
            <input
              type="text"
              value={textoConfirmacion}
              onChange={function(e) { setTextoConfirmacion(e.target.value); }}
              className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-simea-text focus:outline-none focus:border-simea-accent transition mono"
              placeholder="ARCHIVAR"
              autoFocus
            />
            <div className="flex gap-2">
              <Button
                variant="danger"
                onClick={archivarReconocidas}
                disabled={textoConfirmacion !== 'ARCHIVAR' || archivando}
              >
                {archivando ? 'Archivando...' : 'Confirmar y descargar CSV'}
              </Button>
              <Button
                variant="ghost"
                onClick={function() { setMostrarConfirmacion(false); setTextoConfirmacion(''); }}
              >
                Cancelar
              </Button>
            </div>
          </div>
        </Card>
      )}

      {cargando ? (
        <Card className="p-8 text-center text-simea-muted text-sm">Cargando...</Card>
      ) : alertas.length === 0 ? (
        <Card className="p-8 text-center text-simea-muted text-sm">No hay alertas en este filtro</Card>
      ) : (
        <div className="space-y-3">
          {alertas.map(function(a) {
            const expandida = alertaExpandida === a.timestamp;
            const banda = bandaDeCluster(a.cluster_id, a.equipo_id);
            const descripcion = componerDescripcion(a, banda);
            const datosTecVisibles = datosTecnicosExpandidos[a.timestamp];
            const variablesMedidasVisibles = variablesMedidasExpandidas[a.timestamp];

            // Calcular valores esperados y porcentajes
            const espP = banda ? banda.potencia_media : null;
            const espI = banda ? banda.corriente_media : null;
            const espFP = banda ? banda.fp_media : null;
            const pctP = espP !== null ? porcentajeDesvio(a.potencia_kw, espP) : 0;
            const pctI = espI !== null ? porcentajeDesvio(a.corriente_a, espI) : 0;
            const pctFP = espFP !== null ? porcentajeDesvio(a.factor_potencia, espFP) : 0;

            const catP = clasificarMagnitud(a.desvio_potencia);
            const catI = clasificarMagnitud(a.desvio_corriente);
            const catFP = clasificarMagnitud(a.desvio_fp);

            const estaMarcada = props.alertaMarcadaId === a.timestamp;

            return (
              <Card
                key={a.timestamp}
                className={"p-0 overflow-hidden transition-all " + (estaMarcada ? "ring-2 ring-simea-accent shadow-lg shadow-simea-accent/20" : "")}
                ref={estaMarcada ? alertaMarcadaRef : null}
              >
                {/* Nivel 1: fila principal, siempre visible */}
                <div
                  className="p-4 cursor-pointer hover:bg-simea-bg/30 transition"
                  onClick={function() { toggleExpansion(a.timestamp); }}
                >
                  <div className="flex items-center justify-between gap-4">
                    <div className="flex items-center gap-3 flex-wrap">
                      <span className={"text-simea-muted text-sm transition-transform " + (expandida ? "rotate-90" : "")}>▶</span>
                      <Badge color={colorSeveridad[a.severidad] || 'default'}>{a.severidad}</Badge>
                      <span className="text-sm text-simea-text font-medium">{a.equipo_nombre || a.equipo_id}</span>
                      <span className="text-simea-muted text-xs">·</span>
                      <span className="text-xs text-simea-muted mono">
                        {formatearFechaHora(a.timestamp)}
                      </span>
                      <span className="text-sm font-medium">Anomalía detectada</span>
                    </div>
                    <div className="flex items-center gap-3" onClick={function(e) { e.stopPropagation(); }}>
                      {a.reconocida && <Badge color="ok">Reconocida</Badge>}
                      {!a.reconocida && reconociendo !== a.timestamp && (
                        <Button
                          variant="secondary"
                          onClick={function() { setReconociendo(a.timestamp); setDescripcionReconoc(''); if (!expandida) toggleExpansion(a.timestamp); }}
                        >
                          Reconocer
                        </Button>
                      )}
                      {a.reconocida && (
                        <button
                          onClick={function() { eliminarAlerta(a.timestamp, a.equipo_id); }}
                          className="text-xs text-simea-muted hover:text-red-400 transition"
                          title="Eliminar alerta"
                        >
                          Eliminar
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* Nivel 2: detalle expandido */}
                {expandida && (
                  <div className="border-t border-simea-border bg-simea-bg/20 p-6 space-y-6">
                    {/* Descripción sintomática */}
                    <div>
                      <div className="text-xs font-semibold uppercase tracking-wider text-simea-muted mb-2">
                        Descripción de la anomalía
                      </div>
                      <p className="text-sm text-simea-text leading-relaxed">{descripcion}</p>
                      <div className="text-xs text-simea-muted mt-2">
                        Estado operativo: <span className="text-simea-text mono">Cluster #{a.cluster_id}</span>
                      </div>
                    </div>

                    {/* Variables medidas: sección desplegable */}
                    <div>
                      <button
                        onClick={function() { toggleVariablesMedidas(a.timestamp); }}
                        className="text-xs font-semibold uppercase tracking-wider text-simea-muted hover:text-simea-accent2 transition flex items-center gap-2"
                      >
                        <span className={"transition-transform " + (variablesMedidasVisibles ? "rotate-90" : "")}>▶</span>
                        Variables medidas
                      </button>

                      {variablesMedidasVisibles && (
                      <div className="mt-3">
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                        {(function() {
                          // Preparar los datos de cada variable en una estructura común
                          const variables = [
                            {
                              nombre: 'Potencia',
                              medido: a.potencia_kw, esperado: espP,
                              unidad: 'kW', decimales: 2,
                              pct: pctP, categoria: catP,
                            },
                            {
                              nombre: 'Corriente',
                              medido: a.corriente_a, esperado: espI,
                              unidad: 'A', decimales: 2,
                              pct: pctI, categoria: catI,
                            },
                            {
                              nombre: 'Factor de potencia',
                              medido: a.factor_potencia, esperado: espFP,
                              unidad: '', decimales: 3,
                              pct: pctFP, categoria: catFP,
                            },
                          ];

                          // Colores por categoría de desvío
                          const colorCategoria = {
                            'normal': 'text-emerald-400',
                            'leve': 'text-amber-300',
                            'significativo': 'text-orange-300',
                            'marcado': 'text-red-300',
                          };

                          return variables.map(function(v) {
                            const direccion = v.esperado !== null && v.medido > v.esperado ? 'up' : 'down';
                            const colorDesvio = colorCategoria[v.categoria] || 'text-simea-muted';
                            const unidadTxt = v.unidad ? ' ' + v.unidad : '';

                            return (
                              <div key={v.nombre} className="border border-simea-border rounded-lg p-4 bg-simea-bg/30">
                                {/* Nombre de la variable */}
                                <div className="text-xs font-semibold uppercase tracking-wider text-simea-muted mb-3">
                                  {v.nombre}
                                </div>

                                {/* Valor medido (grande, protagonista) */}
                                <div className="mb-3">
                                  <div className="text-[10px] uppercase tracking-wider text-simea-muted mb-1">Medido</div>
                                  <div className="text-xl font-semibold text-simea-text mono">
                                    {Number(v.medido).toFixed(v.decimales)}
                                    {v.unidad && <span className="text-sm text-simea-muted ml-1">{v.unidad}</span>}
                                  </div>
                                </div>

                                {/* Valor esperado */}
                                <div className="mb-3">
                                  <div className="text-[10px] uppercase tracking-wider text-simea-muted mb-1">Esperado</div>
                                  <div className="text-sm text-simea-muted mono">
                                    {v.esperado !== null ? Number(v.esperado).toFixed(v.decimales) + unidadTxt : '—'}
                                  </div>
                                </div>

                                {/* Desvío con dirección y categoría */}
                                <div>
                                  <div className="text-[10px] uppercase tracking-wider text-simea-muted mb-1">Desvío</div>
                                  {v.esperado !== null ? (
                                    <div className={"flex items-baseline gap-1.5 " + colorDesvio}>
                                      <span className="text-base font-semibold mono">
                                        {direccion === 'up' ? '↑' : '↓'} {formatoPorcentaje(v.pct)}
                                      </span>
                                      <span className="text-xs">{textoCategoria(v.categoria)}</span>
                                    </div>
                                  ) : (
                                    <div className="text-sm text-simea-muted">—</div>
                                  )}
                                </div>
                              </div>
                            );
                          });
                        })()}
                      </div>
                      </div>
                      )}
                    </div>

                    {/* Nivel 3: Datos técnicos colapsables */}
                    <div>
                      <button
                        onClick={function() { toggleDatosTecnicos(a.timestamp); }}
                        className="text-xs font-semibold uppercase tracking-wider text-simea-muted hover:text-simea-accent2 transition flex items-center gap-2"
                      >
                        <span className={"transition-transform " + (datosTecVisibles ? "rotate-90" : "")}>▶</span>
                        Datos técnicos detallados
                      </button>

                      {datosTecVisibles && (
                        <div className="mt-3 grid grid-cols-1 md:grid-cols-2 gap-3">
                          {/* Bloque desvíos estadísticos */}
                          <div className="border border-simea-border rounded-lg p-4 bg-simea-bg/30">
                            <div className="text-xs font-semibold uppercase tracking-wider text-simea-muted mb-3">
                              Desvíos estadísticos
                            </div>
                            <div className="space-y-2 text-sm">
                              <div>
                                <div className="text-xs text-simea-muted mb-0.5">Potencia</div>
                                <div className="text-simea-text mono">{Number(a.desvio_potencia).toFixed(2)}σ</div>
                              </div>
                              <div>
                                <div className="text-xs text-simea-muted mb-0.5">Corriente</div>
                                <div className="text-simea-text mono">{Number(a.desvio_corriente).toFixed(2)}σ</div>
                              </div>
                              <div>
                                <div className="text-xs text-simea-muted mb-0.5">Factor de potencia</div>
                                <div className="text-simea-text mono">{Number(a.desvio_fp).toFixed(2)}σ</div>
                              </div>
                            </div>
                          </div>

                          <div className="border border-simea-border rounded-lg p-4 bg-simea-bg/30">

                              Detección multivariable
                            </div>
                            <div className="space-y-2 text-sm">
                              <div>
                                <div className="text-xs text-simea-muted mb-0.5">Score Isolation Forest</div>

                              <div>
                                <div className="text-xs text-simea-muted mb-0.5">Desvío máximo observado</div>
                                <div className="text-simea-text mono">{Number(a.desvio_maximo).toFixed(2)}σ</div>
