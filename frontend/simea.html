                    {reconociendo === a.timestamp && (
                      <div className="pt-3 border-t border-simea-border">
                        <label className="block text-xs uppercase tracking-wider text-simea-muted mb-1.5">
                          Descripción o hipótesis sobre la causa
                        </label>
                        <textarea
                          value={descripcionReconoc}
                          onChange={function(e) {
                            const limpio = e.target.value.replace(/[\r\n]+/g, ' ');
                            setDescripcionReconoc(limpio);
                          }}
                          onKeyDown={function(e) {
                            if (e.key === 'Enter') {
                              e.preventDefault();
                            }
                          }}
                          onPaste={function(e) {
                            e.preventDefault();
                            const textoPegado = (e.clipboardData || window.clipboardData).getData('text');
                            const limpio = textoPegado.replace(/[\r\n]+/g, ' ');
                            setDescripcionReconoc(function(prev) { return prev + limpio; });
                          }}
                          rows={2}
                          placeholder="Ej: Falso positivo por cambio de operador. Se verificó equipo sin novedades."
                          className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-simea-accent transition resize-none"
                        />
                        <div className="text-xs text-simea-muted mt-1">
                          Los saltos de línea no están permitidos para garantizar la integridad del CSV.
                        </div>
                        <div className="flex gap-2 mt-2">
                          <Button
                            onClick={function() { reconocer(a.timestamp, a.equipo_id); }}
                            disabled={reconocAccion || !descripcionReconoc.trim()}
                          >
                            {reconocAccion ? 'Reconociendo...' : 'Confirmar reconocimiento'}
                          </Button>
                          <Button
                            variant="ghost"
                            onClick={function() { setReconociendo(null); setDescripcionReconoc(''); }}
                          >
                            Cancelar
                          </Button>
                        </div>
                      </div>
                    )}

                    {/* Info de reconocimiento (si ya está reconocida) */}
                    {a.reconocimiento && (
                      <div className="pt-3 border-t border-simea-border">
                        <div className="text-xs text-simea-muted mb-1">
                          Reconocida por <span className="text-simea-text">{a.reconocimiento.usuario}</span>
                          <span className="mx-1">·</span>
                          {formatearFechaHora(a.reconocimiento.fecha)}
                        </div>
                        <div className="text-sm">{a.reconocimiento.descripcion}</div>
                      </div>
                    )}
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ModelosView(props) {
  const [modelos, setModelos] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [mensaje, setMensaje] = useState('');
  const [error, setError] = useState('');
  const [editando, setEditando] = useState(null);
  const [descripcionEdit, setDescripcionEdit] = useState('');
  const [eliminando, setEliminando] = useState(null);

  function recargar() {
    setCargando(true);
    api.get('/api/equipos/' + EQUIPO_ID + '/modelos', props.token)
      .then(function(r) { setModelos(r.modelos || []); })
      .catch(function(e) { setError(e.message); })
      .finally(function() { setCargando(false); });
  }

  useEffect(function() {
    recargar();
  }, [props.token]);

  function activar(id) {
    setMensaje(''); setError('');
    api.post('/api/equipos/' + EQUIPO_ID + '/modelos/' + id + '/activar', props.token)
      .then(function() {
        setMensaje('Modelo #' + id + ' activado');
        recargar();
      })
      .catch(function(e) { setError(e.message); });
  }

  function guardarDescripcion(id) {
    setMensaje(''); setError('');
    fetch(API_BASE + '/api/equipos/' + EQUIPO_ID + '/modelos/' + id, {
      method: 'PATCH',
      headers: {
        'Authorization': 'Bearer ' + props.token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ descripcion: descripcionEdit || null })
    })
      .then(function(r) {
        if (!r.ok) throw new Error('Error al actualizar');
        return r.json();
      })
      .then(function() {
        setMensaje('Descripción actualizada');
        setEditando(null);
        setDescripcionEdit('');
        recargar();
      })
      .catch(function(e) { setError(e.message); });
  }

  function confirmarEliminar(id) {
    setMensaje(''); setError('');
    api.delete = api.delete || function(path, token) {
      return fetch(API_BASE + path, {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + token },
      }).then(function(r) {
        if (!r.ok) {
          return r.json().catch(function() { return { detail: 'Error' }; })
            .then(function(err) { throw new Error(err.detail || 'Error'); });
        }
        return r.json();
      });
    };
    api.delete('/api/equipos/' + EQUIPO_ID + '/modelos/' + id, props.token)
      .then(function() {
        setMensaje('Modelo #' + id + ' eliminado');
        setEliminando(null);
        recargar();
      })
      .catch(function(e) {
        setError(e.message);
        setEliminando(null);
      });
  }

  return (
    <div className="space-y-6">
      {!props.embebido && (
        <div>
          <h1 className="text-2xl font-bold mb-1">Modelos aprendidos</h1>
          <p className="text-sm text-simea-muted">
            Gestión de los modelos entrenados del equipo. Cada modelo representa un patrón de comportamiento aprendido bajo condiciones específicas de operación.
          </p>
        </div>
      )}

      {mensaje && (
        <div className="bg-emerald-950/40 border border-emerald-900 rounded-lg px-3 py-2 text-sm text-emerald-200">
          {mensaje}
        </div>
      )}
      {error && (
        <div className="bg-red-950/40 border border-red-900 rounded-lg px-3 py-2 text-sm text-red-300">
          {error}
        </div>
      )}

      {cargando ? (
        <Card className="p-8 text-center text-simea-muted text-sm">Cargando modelos...</Card>
      ) : modelos.length === 0 ? (
        <Card className="p-8 text-center text-simea-muted text-sm">
          No hay modelos entrenados. Inicie una sesión de aprendizaje para crear el primero.
        </Card>
      ) : (
        <div className="space-y-3">
          {modelos.map(function(m) {
            const esActivo = m.estado === 'activo';
            return (
              <Card key={m.id} className={"p-5 " + (esActivo ? "border-emerald-700/50" : "")}>
                <div className="flex items-start justify-between gap-4 mb-3">
                  <div className="flex items-center gap-3 flex-wrap">
                    <span className="text-lg font-semibold mono">#{m.id}</span>
                    {esActivo ? (
                      <Badge color="ok">Activo</Badge>
                    ) : (
                      <Badge color="default">Inactivo</Badge>
                    )}
                    <span className="text-xs text-simea-muted">
                      Entrenado el {formatearFechaHora(m.fecha_entrenamiento)}
                    </span>
                  </div>
                  <div className="flex gap-2">
                    {/* Activar: solo aparece si el modelo NO es el activo.
                        Si solo hay un modelo, ya está activo por defecto, así que no aplica. */}
                    {!esActivo && (
                      <Button variant="primary" onClick={function() { activar(m.id); }} className="text-xs px-3 py-1.5">
                        Activar
                      </Button>
                    )}
                    {/* Eliminar: siempre disponible.
                        Si se elimina el activo, el equipo queda sin modelo hasta un nuevo aprendizaje. */}
                    <button
                      onClick={function() { setEliminando(m.id); }}
                      className="text-xs text-simea-muted hover:text-red-400 transition px-2"
                      title="Eliminar"
                    >
                      Eliminar
                    </button>
                  </div>
                </div>

                {editando === m.id ? (
                  <div className="mb-3 space-y-2">
                    <textarea
                      value={descripcionEdit}
                      onChange={function(e) { setDescripcionEdit(e.target.value); }}
                      rows={2}
                      maxLength={500}
                      className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-simea-accent transition resize-none"
                      placeholder="Describa las condiciones bajo las cuales se entrenó este modelo..."
                      autoFocus
                    />
                    <div className="flex gap-2">
                      <Button onClick={function() { guardarDescripcion(m.id); }} className="text-xs">
                        Guardar
                      </Button>
                      <Button variant="ghost" onClick={function() { setEditando(null); setDescripcionEdit(''); }} className="text-xs">
                        Cancelar
                      </Button>
                    </div>
                  </div>
                ) : (
                  <div className="mb-3">
                    <div className="text-sm text-simea-text mb-1">
                      {m.descripcion || <span className="text-simea-muted italic">Sin descripción</span>}
                    </div>
                    <button
                      onClick={function() { setEditando(m.id); setDescripcionEdit(m.descripcion || ''); }}
                      className="text-xs text-simea-accent2 hover:text-simea-accent transition"
                    >
                      {m.descripcion ? 'Editar descripción' : 'Agregar descripción'}
                    </button>
                  </div>
                )}

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs text-simea-muted pt-3 border-t border-simea-border">
                  <div>
                    <div className="uppercase tracking-wider mb-1">Estados</div>
                    <div className="mono text-simea-text">{m.k_optimo}</div>
                  </div>
                  <div>
                    <div className="uppercase tracking-wider mb-1">Umbral IF</div>
                    <div className="mono text-simea-text">{m.umbral_iforest ? m.umbral_iforest.toFixed(4) : '—'}</div>
                  </div>
                  <div>
                    <div className="uppercase tracking-wider mb-1">Datos desde</div>
                    <div className="mono text-simea-text text-xs">{formatearFechaHora(m.fecha_inicio_datos)}</div>
                  </div>
                  <div>
                    <div className="uppercase tracking-wider mb-1">Datos hasta</div>
                    <div className="mono text-simea-text text-xs">{formatearFechaHora(m.fecha_fin_datos)}</div>
                  </div>
                </div>

                {eliminando === m.id && (
                  <div className="mt-4 pt-4 border-t border-amber-800/50 bg-amber-950/20 rounded-lg p-3">
                    <div className="text-sm text-amber-200 mb-3">
                      ¿Confirma la eliminación del modelo #{m.id}? Esta acción es irreversible y se perderán las bandas de tolerancia y la curva patrón asociadas.
                    </div>
                    {esActivo && (
                      <div className="text-xs text-red-300 bg-red-950/30 border border-red-900/50 rounded-lg p-2 mb-3">
                        <span className="font-semibold">Atención:</span> este es el modelo activo del equipo.
                        {modelos.length === 1
                          ? ' Al eliminarlo, el equipo quedará sin ningún modelo y será necesario realizar una nueva sesión de aprendizaje antes de poder iniciar el monitoreo.'
                          : ' Al eliminarlo, deberá activar otro modelo antes de poder iniciar el monitoreo.'}
                      </div>
                    )}
                    <div className="flex gap-2">
                      <Button variant="danger" onClick={function() { confirmarEliminar(m.id); }} className="text-xs">
                        Eliminar definitivamente
                      </Button>
                      <Button variant="ghost" onClick={function() { setEliminando(null); }} className="text-xs">
                        Cancelar
                      </Button>
                    </div>
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

// Modal reusable para crear o editar un usuario
function ModalUsuario(props) {
  const esEdicion = props.modo === 'editar';
  const usuarioExistente = props.usuario;

  const [usuario, setUsuario] = useState(esEdicion ? usuarioExistente.usuario : '');
  const [nombre, setNombre] = useState(esEdicion ? usuarioExistente.nombre : '');
  const [rol, setRol] = useState(esEdicion ? usuarioExistente.rol : 'operador');
  const [password, setPassword] = useState('');
  const [passwordConfirmar, setPasswordConfirmar] = useState('');
  const [cambiarPassword, setCambiarPassword] = useState(!esEdicion);
  const [error, setError] = useState('');
  const [guardando, setGuardando] = useState(false);

  function validarYGuardar() {
    setError('');

    if (!esEdicion) {
      if (!usuario.match(/^[a-zA-Z0-9_.-]{3,50}$/)) {
        setError('El nombre de usuario debe tener entre 3 y 50 caracteres (letras, números, guiones, puntos).');
        return;
      }
    }
    if (!nombre.trim()) {
      setError('El nombre no puede estar vacío.');
      return;
    }
    if (cambiarPassword || !esEdicion) {
      if (password.length < 6) {
        setError('La contraseña debe tener al menos 6 caracteres.');
        return;
      }
      if (password !== passwordConfirmar) {
        setError('Las contraseñas no coinciden.');
        return;
      }
    }

    // Construir el objeto a enviar
    let datos;
    if (esEdicion) {
      datos = { nombre: nombre, rol: rol };
      if (cambiarPassword) datos.password = password;
    } else {
      datos = { usuario: usuario, nombre: nombre, rol: rol, password: password };
    }

    setGuardando(true);
    Promise.resolve()
      .then(function() { return props.onGuardar(datos); })
      .catch(function(e) { setError(e.message || 'Error al guardar'); })
      .finally(function() { setGuardando(false); });
  }

  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={props.onCerrar}>
      <div className="bg-simea-card border border-simea-border rounded-xl shadow-2xl w-full max-w-md" onClick={function(e) { e.stopPropagation(); }}>
        {/* Cabecera */}
        <div className="p-5 border-b border-simea-border flex items-center justify-between">
          <h3 className="text-lg font-semibold">
            {esEdicion ? 'Editar usuario' : 'Nuevo usuario'}
          </h3>
          <button onClick={props.onCerrar} className="w-8 h-8 rounded-lg flex items-center justify-center text-simea-muted hover:text-simea-text hover:bg-simea-bg/40 transition">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        {/* Cuerpo */}
        <div className="p-5 space-y-4">
          {/* Nombre de usuario */}
          <div>
            <label className="block text-xs uppercase tracking-wider text-simea-muted mb-1.5">
              Nombre de usuario
            </label>
            <input
              type="text"
              value={usuario}
              onChange={function(e) { setUsuario(e.target.value); }}
              disabled={esEdicion}
              className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm text-simea-text focus:outline-none focus:border-simea-accent transition disabled:opacity-60 disabled:cursor-not-allowed mono"
              placeholder="ej: juan_perez"
            />
            {esEdicion && (
              <div className="text-xs text-simea-muted mt-1">
                El nombre de usuario no se puede modificar una vez creado.
              </div>
            )}
          </div>

          {/* Nombre completo */}
          <div>
            <label className="block text-xs uppercase tracking-wider text-simea-muted mb-1.5">
              Nombre visible
            </label>
            <input
              type="text"
              value={nombre}
              onChange={function(e) { setNombre(e.target.value); }}
              className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm text-simea-text focus:outline-none focus:border-simea-accent transition"
              placeholder="ej: Juan Pérez"
            />
          </div>

          {/* Rol */}
          <div>
            <label className="block text-xs uppercase tracking-wider text-simea-muted mb-1.5">
              Rol
            </label>
            <select
              value={rol}
              onChange={function(e) { setRol(e.target.value); }}
              className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm text-simea-text focus:outline-none focus:border-simea-accent transition"
            >
              <option value="operador">Operador</option>
              <option value="supervisor">Supervisor</option>
            </select>
            <div className="text-xs text-simea-muted mt-1">
              Los supervisores pueden gestionar equipos y otros usuarios.
            </div>
          </div>

          {/* Contraseña (siempre en nuevo, opcional en edición) */}
          {esEdicion && (
            <div className="flex items-center gap-2 pt-2 border-t border-simea-border">
              <input
                type="checkbox"
                id="cambiar-pwd"
                checked={cambiarPassword}
                onChange={function(e) { setCambiarPassword(e.target.checked); }}
                className="w-4 h-4"
              />
              <label htmlFor="cambiar-pwd" className="text-sm text-simea-text cursor-pointer">
                Cambiar contraseña
              </label>
            </div>
          )}

          {(cambiarPassword || !esEdicion) && (
            <>
              <div>
                <label className="block text-xs uppercase tracking-wider text-simea-muted mb-1.5">
                  {esEdicion ? 'Nueva contraseña' : 'Contraseña'}
                </label>
                <input
                  type="password"
                  value={password}
                  onChange={function(e) { setPassword(e.target.value); }}
                  className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm text-simea-text focus:outline-none focus:border-simea-accent transition"
                  placeholder="Mínimo 6 caracteres"
                />
              </div>
              <div>
                <label className="block text-xs uppercase tracking-wider text-simea-muted mb-1.5">
                  Confirmar contraseña
                </label>
                <input
                  type="password"
                  value={passwordConfirmar}
                  onChange={function(e) { setPasswordConfirmar(e.target.value); }}
                  className="w-full bg-simea-bg border border-simea-border rounded-lg px-3 py-2 text-sm text-simea-text focus:outline-none focus:border-simea-accent transition"
                  placeholder="Repita la contraseña"
                />
              </div>
            </>
          )}

          {error && (
            <div className="bg-red-950/40 border border-red-900 rounded-lg px-3 py-2 text-sm text-red-300">
              {error}
            </div>
          )}
        </div>

        {/* Pie con acciones */}
        <div className="p-5 border-t border-simea-border flex items-center justify-end gap-2">
          <Button variant="ghost" onClick={props.onCerrar}>Cancelar</Button>
          <Button onClick={validarYGuardar} disabled={guardando}>
            {guardando ? 'Guardando...' : (esEdicion ? 'Guardar cambios' : 'Crear usuario')}
          </Button>
        </div>
      </div>
    </div>
  );
}

// Modal de confirmación para eliminar un usuario
function ModalConfirmarEliminarUsuario(props) {
  const [eliminando, setEliminando] = useState(false);

  function confirmar() {
    setEliminando(true);
    Promise.resolve()
      .then(function() { return props.onConfirmar(); })
      .finally(function() { setEliminando(false); });
  }

  return (
    <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick={props.onCerrar}>
      <div className="bg-simea-card border border-simea-border rounded-xl shadow-2xl w-full max-w-sm" onClick={function(e) { e.stopPropagation(); }}>
        <div className="p-5">
          <div className="flex items-center gap-3 mb-3">
            <div className="w-10 h-10 rounded-full bg-red-950/40 border border-red-900 flex items-center justify-center flex-shrink-0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-red-400">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            </div>
            <div>
              <h3 className="text-base font-semibold">Eliminar usuario</h3>
              <div className="text-xs text-simea-muted">Esta acción no se puede deshacer</div>
            </div>
          </div>
          <p className="text-sm text-simea-text">
            ¿Confirmás la eliminación del usuario <span className="mono font-semibold">{props.usuario.usuario}</span> ({props.usuario.nombre})?
          </p>
        </div>
        <div className="p-5 border-t border-simea-border flex items-center justify-end gap-2">
          <Button variant="ghost" onClick={props.onCerrar}>Cancelar</Button>
          <Button onClick={confirmar} disabled={eliminando}>
            {eliminando ? 'Eliminando...' : 'Eliminar'}
          </Button>
        </div>
      </div>
    </div>
  );
}

function ConfiguracionView(props) {
  const [tab, setTab] = useState('nuevo_equipo');

  const esSupervisor = props.usuarioActual && props.usuarioActual.rol === 'supervisor';

  const [nuevoEquipoId, setNuevoEquipoId] = useState('');
  const [nuevoEquipoNombre, setNuevoEquipoNombre] = useState('');
  const [nuevoEquipoTipoOp, setNuevoEquipoTipoOp] = useState('ciclico');
  const [nuevoEquipoDescripcion, setNuevoEquipoDescripcion] = useState('');
  const [nuevoEquipoTiempoMin, setNuevoEquipoTiempoMin] = useState(30);
  const [nuevoEquipoTiempoRec, setNuevoEquipoTiempoRec] = useState(60);
  const [equipoCargando, setEquipoCargando] = useState(false);
  const [equipoMensaje, setEquipoMensaje] = useState('');
  const [equipoError, setEquipoError] = useState('');

  // Estados para la gestión de equipos (tabla + modal de creación)
  const [equipos, setEquipos] = useState([]);
  const [equiposCargando, setEquiposCargando] = useState(false);
  const [equiposError, setEquiposError] = useState('');
  const [modalNuevoEquipo, setModalNuevoEquipo] = useState(false);

  // Estados para edición y baja/reactivación
  const [menuEquipoAbierto, setMenuEquipoAbierto] = useState(null);      // { id, x, y } del equipo con menú abierto
  const [modalEditarEquipo, setModalEditarEquipo] = useState(null);      // objeto equipo en edición o null
  const [equipoParaCambiarEstado, setEquipoParaCambiarEstado] = useState(null); // equipo al que se le va a dar de baja/reactivar

  // Cerrar el menú de tres puntos al hacer clic afuera o al hacer scroll.
  // Usamos position: fixed para renderizar el menú fuera del overflow-hidden
  // de la Card, por eso también lo cerramos al scrollear (si el usuario
  // scrollea, el menú quedaría flotando en el mismo lugar de pantalla).
  useEffect(function() {
    if (menuEquipoAbierto === null) return;
    function cerrar() { setMenuEquipoAbierto(null); }
    document.addEventListener('click', cerrar);
    window.addEventListener('scroll', cerrar, true); // capture=true para scroll de contenedores internos
    return function() {
      document.removeEventListener('click', cerrar);
      window.removeEventListener('scroll', cerrar, true);
    };
  }, [menuEquipoAbierto]);

  // Abrir el modal de edición prellenado con los datos actuales del equipo
  function abrirModalEditar(eq) {
    // El modal reutiliza los mismos estados del modal de creación
    setNuevoEquipoId(eq.id);
    setNuevoEquipoNombre(eq.nombre || '');
    setNuevoEquipoTipoOp(eq.tipo_operacion || 'ciclico');
    setNuevoEquipoDescripcion(eq.descripcion || '');
    // Los tiempos vienen solo en el detalle; los cargamos desde el endpoint
    api.get('/api/equipos/' + eq.id, props.token)
      .then(function(det) {
        setNuevoEquipoTiempoMin(det.tiempo_minimo_aprendizaje || 30);
        setNuevoEquipoTiempoRec(det.tiempo_recomendado_aprendizaje || 60);
      })
      .catch(function() {
        setNuevoEquipoTiempoMin(30);
        setNuevoEquipoTiempoRec(60);
      });
    setEquipoMensaje('');
    setEquipoError('');
    setModalEditarEquipo(eq);
  }

  // Guardar cambios de edición
  function guardarEdicionEquipo() {
    if (!modalEditarEquipo) return;
    setEquipoCargando(true);
    setEquipoMensaje('');
    setEquipoError('');

    if (parseInt(nuevoEquipoTiempoRec) < parseInt(nuevoEquipoTiempoMin)) {
      setEquipoError('El tiempo recomendado no puede ser menor que el mínimo');
      setEquipoCargando(false);
      return;
    }

    api.put('/api/equipos/' + modalEditarEquipo.id, props.token, {
      nombre: nuevoEquipoNombre,
      descripcion: nuevoEquipoDescripcion || null,
      tiempo_minimo_aprendizaje: parseInt(nuevoEquipoTiempoMin),
      tiempo_recomendado_aprendizaje: parseInt(nuevoEquipoTiempoRec),
    })
      .then(function() {
        setEquipoMensaje('Equipo "' + nuevoEquipoNombre + '" actualizado correctamente.');
        setModalEditarEquipo(null);
        cargarEquipos();
        if (props.recargarEquipos) props.recargarEquipos();
      })
      .catch(function(e) { setEquipoError(e.message); })
      .finally(function() { setEquipoCargando(false); });
  }

  // Confirmar dar de baja o reactivar
  function confirmarCambioEstado() {
    if (!equipoParaCambiarEstado) return;
    const eq = equipoParaCambiarEstado;
    const dandoDeBaja = eq.activo !== false;
    setEquipoCargando(true);
    setEquipoMensaje('');
    setEquipoError('');

    // Definir api.delete si aún no existe (patrón usado en otros lados del archivo)
    api.delete = api.delete || function(path, token) {
      return fetch(API_BASE + path, {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + token },
      }).then(function(r) {
        if (!r.ok) {
          return r.json().catch(function() { return { detail: 'Error' }; })
            .then(function(err) { throw new Error(err.detail || 'Error'); });
        }
        return r.json();
      });
    };

    const promesa = dandoDeBaja
      ? api.delete('/api/equipos/' + eq.id, props.token)
      : api.put('/api/equipos/' + eq.id, props.token, { activo: true });

    promesa
      .then(function() {
        setEquipoMensaje(
          dandoDeBaja
            ? 'Equipo "' + eq.nombre + '" dado de baja.'
            : 'Equipo "' + eq.nombre + '" reactivado.'
        );
        setEquipoParaCambiarEstado(null);
        cargarEquipos();
        if (props.recargarEquipos) props.recargarEquipos();
      })
      .catch(function(e) {
        setEquipoError(e.message);
        setEquipoParaCambiarEstado(null);
      })
      .finally(function() { setEquipoCargando(false); });
  }

  // Cargar equipos cuando se activa el tab de nuevo_equipo
  useEffect(function() {
    if (tab === 'nuevo_equipo') {
      cargarEquipos();
    }
  }, [tab]);

  function cargarEquipos() {
    setEquiposCargando(true);
    setEquiposError('');
    // Usamos ?incluir_inactivos=true para mostrar también los dados de baja
    api.get('/api/equipos?incluir_inactivos=true', props.token)
      .then(function(r) { setEquipos(r.equipos || r || []); })
      .catch(function(e) { setEquiposError(e.message); })
      .finally(function() { setEquiposCargando(false); });
  }

  // Estados para la gestión de usuarios
  const [usuarios, setUsuarios] = useState([]);
  const [usuariosCargando, setUsuariosCargando] = useState(false);
  const [usuariosError, setUsuariosError] = useState('');
  const [usuariosMensaje, setUsuariosMensaje] = useState('');
  const [modalNuevoUsuario, setModalNuevoUsuario] = useState(false);
  const [modalEditarUsuario, setModalEditarUsuario] = useState(null);
  const [modalEliminarUsuario, setModalEliminarUsuario] = useState(null);
  const [menuUsuarioAbierto, setMenuUsuarioAbierto] = useState(null); // { id, x, y } del usuario con menú abierto

  // Cerrar el menú al hacer clic afuera o al scrollear (mismo patrón que en equipos)
  useEffect(function() {
    if (menuUsuarioAbierto === null) return;
    function cerrar() { setMenuUsuarioAbierto(null); }
    document.addEventListener('click', cerrar);
    window.addEventListener('scroll', cerrar, true);
    return function() {
      document.removeEventListener('click', cerrar);
      window.removeEventListener('scroll', cerrar, true);
    };
  }, [menuUsuarioAbierto]);

  // Cargar usuarios cuando se activa el tab (solo si es supervisor)
  useEffect(function() {
    if (tab === 'usuarios' && esSupervisor) {
      cargarUsuarios();
    }
  }, [tab]);

  function cargarUsuarios() {
    setUsuariosCargando(true);
    setUsuariosError('');
    api.get('/api/usuarios', props.token)
      .then(function(r) { setUsuarios(r.usuarios || []); })
      .catch(function(e) { setUsuariosError(e.message); })
      .finally(function() { setUsuariosCargando(false); });
  }

  function crearEquipo() {
    setEquipoCargando(true);
    setEquipoMensaje('');
    setEquipoError('');

    if (!nuevoEquipoId.match(/^[a-z0-9_]+$/)) {
      setEquipoError('El ID debe contener solo letras minúsculas, números y guiones bajos');
      setEquipoCargando(false);
      return;
    }
    if (parseInt(nuevoEquipoTiempoRec) < parseInt(nuevoEquipoTiempoMin)) {
      setEquipoError('El tiempo recomendado no puede ser menor que el mínimo');
      setEquipoCargando(false);
      return;
    }

    api.post('/api/equipos', props.token, {
      id: nuevoEquipoId,
      nombre: nuevoEquipoNombre,
      descripcion: nuevoEquipoDescripcion || null,
      tiempo_minimo_aprendizaje: parseInt(nuevoEquipoTiempoMin),
      tiempo_recomendado_aprendizaje: parseInt(nuevoEquipoTiempoRec),
    })
      .then(function() {
        setEquipoMensaje('Equipo "' + nuevoEquipoNombre + '" creado correctamente. Ya está disponible en el selector del panel principal.');
        setNuevoEquipoId('');
        setNuevoEquipoNombre('');
        setNuevoEquipoTipoOp('ciclico');
        setNuevoEquipoDescripcion('');
        setNuevoEquipoTiempoMin(30);
        setNuevoEquipoTiempoRec(60);
        if (props.recargarEquipos) {
          props.recargarEquipos();
        }
      })
      .catch(function(e) { setEquipoError(e.message); })
      .finally(function() { setEquipoCargando(false); });
  }

  return (
    <div className="space-y-6">
      <div className="flex gap-2 border-b border-simea-border">
        <button
          onClick={function() { setTab('nuevo_equipo'); }}
          className={"px-4 py-2.5 text-sm font-medium transition border-b-2 -mb-px " + (
            tab === 'nuevo_equipo'
              ? "text-simea-accent2 border-simea-accent"
              : "text-simea-muted border-transparent hover:text-simea-text"
          )}
        >
          Registro de equipos
        </button>
        <button
          onClick={function() { if (esSupervisor) setTab('usuarios'); }}
          disabled={!esSupervisor}
          title={!esSupervisor ? "Requiere permisos de supervisor" : ""}
          className={"px-4 py-2.5 text-sm font-medium transition border-b-2 -mb-px flex items-center gap-2 " + (
            tab === 'usuarios'
              ? "text-simea-accent2 border-simea-accent"
              : esSupervisor
                ? "text-simea-muted border-transparent hover:text-simea-text"
                : "text-simea-muted/40 border-transparent cursor-not-allowed"
          )}
        >
          Gestión de usuarios
          {!esSupervisor && (
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          )}
        </button>
      </div>

      {tab === 'nuevo_equipo' && (
        <>
          {/* Cabecera del tab con acción */}
          <div className="flex items-center justify-end">
            <Button onClick={function() {
              // Resetear el formulario antes de abrir el modal
              setNuevoEquipoId('');
              setNuevoEquipoNombre('');
              setNuevoEquipoTipoOp('ciclico');
              setNuevoEquipoDescripcion('');
              setNuevoEquipoTiempoMin(30);
              setNuevoEquipoTiempoRec(60);
              setEquipoMensaje('');
              setEquipoError('');
              setModalNuevoEquipo(true);
            }}>
              Nuevo equipo
            </Button>
          </div>

          {/* Mensajes de resultado */}
          {equipoMensaje && (
            <div className="bg-emerald-950/40 border border-emerald-900 rounded-lg px-3 py-2 text-sm text-emerald-200">
              {equipoMensaje}
            </div>
          )}
          {equiposError && (
            <div className="bg-red-950/40 border border-red-900 rounded-lg px-3 py-2 text-sm text-red-300">
              {equiposError}
            </div>
          )}

          {/* Tabla de equipos */}
          <Card className="p-0 overflow-hidden">
            {equiposCargando ? (
              <div className="p-8 text-center text-sm text-simea-muted">Cargando equipos...</div>
            ) : equipos.length === 0 ? (
              <div className="p-8 text-center text-sm text-simea-muted">No hay equipos registrados</div>
            ) : (
              <table className="w-full text-sm table-fixed">
                {/* Proporciones de columnas idénticas a Gestión de usuarios para
                    que ambas tablas se vean alineadas al alternar entre pantallas. */}
                <colgroup>
                  <col style={{width: '20%'}} />
                  <col style={{width: '30%'}} />
                  <col style={{width: '15%'}} />
                  <col style={{width: '25%'}} />
                  <col style={{width: '10%'}} />
                </colgroup>
                <thead>
                  <tr className="bg-simea-bg/40 text-xs uppercase tracking-wider text-simea-muted">
                    <th className="text-left px-4 py-3 font-semibold">ID</th>
                    <th className="text-left px-4 py-3 font-semibold">Nombre</th>
                    <th className="text-left px-4 py-3 font-semibold">Estado</th>
                    <th className="text-left px-4 py-3 font-semibold">Fecha de creación</th>
                    <th className="text-right px-4 py-3 font-semibold"></th>
                  </tr>
                </thead>
                <tbody>
                  {equipos.map(function(eq) {
                    const activo = eq.activo !== false;
                    return (
                      <tr key={eq.id} className={"border-t border-simea-border " + (activo ? "" : "opacity-60")}>
                        <td className="px-4 py-3 text-simea-text mono truncate" title={eq.id}>{eq.id}</td>
                        <td className="px-4 py-3 text-simea-text truncate" title={eq.nombre}>{eq.nombre}</td>
                        <td className="px-4 py-3">
                          <Badge color={activo ? 'ok' : 'default'}>
                            {activo ? 'Activo' : 'Fuera de servicio'}
                          </Badge>
                        </td>
                        <td className="px-4 py-3 text-simea-muted mono text-xs">
                          {eq.fecha_alta ? formatearFechaHora(eq.fecha_alta) : (eq.fecha_creacion ? formatearFechaHora(eq.fecha_creacion) : '—')}
                        </td>
                        <td className="px-4 py-3 text-right">
                          <button
                            onClick={function(e) {
                              e.stopPropagation();
                              // Si ya está abierto para este equipo, cerrar. Si no, calcular la posición
                              // del botón en la pantalla y guardar sus coordenadas para posicionar el menú.
                              if (menuEquipoAbierto && menuEquipoAbierto.id === eq.id) {
                                setMenuEquipoAbierto(null);
                              } else {
                                const rect = e.currentTarget.getBoundingClientRect();
                                setMenuEquipoAbierto({ id: eq.id, x: rect.right, y: rect.bottom, activo: activo });
                              }
                            }}
                            className="w-8 h-8 rounded-lg flex items-center justify-center text-simea-muted hover:text-simea-text hover:bg-simea-bg/40 transition mx-auto"
                            title="Acciones"
                          >
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                              <circle cx="12" cy="5" r="1.6"/>
                              <circle cx="12" cy="12" r="1.6"/>
                              <circle cx="12" cy="19" r="1.6"/>
                            </svg>
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </Card>

          {/* Menú flotante de acciones de equipo (position: fixed, fuera del overflow de la Card).
              Se posiciona en las coordenadas del botón que lo abrió. Se cierra al hacer clic
              afuera o al scrollear (ver useEffect). */}
          {menuEquipoAbierto && (function() {
            const eq = equipos.find(function(e) { return e.id === menuEquipoAbierto.id; });
            if (!eq) return null;
            const activo = eq.activo !== false;
            // Si el menú se sale por abajo de la ventana, lo abrimos hacia arriba
            const alturaMenu = 80; // aproximada: 2 items * ~40px
            const espacioAbajo = window.innerHeight - menuEquipoAbierto.y;
            const abrirHaciaArriba = espacioAbajo < alturaMenu + 16;
            const estilo = abrirHaciaArriba
              ? { position: 'fixed', top: (menuEquipoAbierto.y - 40 - alturaMenu) + 'px', left: (menuEquipoAbierto.x - 160) + 'px', zIndex: 50 }
              : { position: 'fixed', top: (menuEquipoAbierto.y + 4) + 'px', left: (menuEquipoAbierto.x - 160) + 'px', zIndex: 50 };
            return (
              <div
                style={estilo}
                className="bg-simea-card border border-simea-border rounded-lg shadow-xl py-1 min-w-[160px] text-left"
                onClick={function(e) { e.stopPropagation(); }}
              >
                <button
                  onClick={function() {
                    setMenuEquipoAbierto(null);
                    abrirModalEditar(eq);
                  }}
                  className="w-full text-left px-3 py-2 text-sm text-simea-text hover:bg-simea-bg/60 transition"
                >
                  Editar
                </button>
                <button
                  onClick={function() {
                    setMenuEquipoAbierto(null);
                    setEquipoParaCambiarEstado(eq);
                  }}
                  className={"w-full text-left px-3 py-2 text-sm hover:bg-simea-bg/60 transition " + (activo ? "text-red-400" : "text-emerald-400")}
                >
                  {activo ? 'Dar de baja' : 'Reactivar'}
                </button>
              </div>
            );
          })()}

          {/* Modal: Editar equipo (reutiliza ModalNuevoEquipo con modo="editar") */}
          {modalEditarEquipo && (
            <ModalNuevoEquipo
              modo="editar"
              nuevoEquipoId={nuevoEquipoId}
              setNuevoEquipoId={setNuevoEquipoId}
              nuevoEquipoNombre={nuevoEquipoNombre}
              setNuevoEquipoNombre={setNuevoEquipoNombre}
              nuevoEquipoTipoOp={nuevoEquipoTipoOp}
              setNuevoEquipoTipoOp={setNuevoEquipoTipoOp}
              nuevoEquipoDescripcion={nuevoEquipoDescripcion}
              setNuevoEquipoDescripcion={setNuevoEquipoDescripcion}
              nuevoEquipoTiempoMin={nuevoEquipoTiempoMin}
              setNuevoEquipoTiempoMin={setNuevoEquipoTiempoMin}
              nuevoEquipoTiempoRec={nuevoEquipoTiempoRec}
              setNuevoEquipoTiempoRec={setNuevoEquipoTiempoRec}
              cargando={equipoCargando}
              error={equipoError}
              onCerrar={function() { setModalEditarEquipo(null); setEquipoError(''); }}
              onGuardar={guardarEdicionEquipo}
            />
          )}

          {/* Diálogo de confirmación al pie: Dar de baja / Reactivar */}
          {equipoParaCambiarEstado && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-4" onClick={function() { setEquipoParaCambiarEstado(null); }}>
              <div className="bg-simea-card border border-simea-border rounded-xl shadow-2xl w-full max-w-md p-5" onClick={function(e) { e.stopPropagation(); }}>
                <p className="text-sm text-simea-text mb-4">
                  {equipoParaCambiarEstado.activo !== false
                    ? '¿Confirma dar de baja el equipo "' + equipoParaCambiarEstado.nombre + '"? Podrá reactivarlo más adelante.'
                    : '¿Confirma reactivar el equipo "' + equipoParaCambiarEstado.nombre + '"?'
                  }
                </p>
                <div className="flex items-center justify-end gap-2">

// Componente carrusel del topbar: rota alertas de todos los equipos cada 4 segundos
function CarruselAlertasTopbar(props) {
  const [indiceActual, setIndiceActual] = useState(0);

  // Filtrar: por cada equipo, mostrar solo la alerta de mayor severidad.
  // Si hay varias con la misma severidad máxima, tomar la más reciente.
  const alertas = React.useMemo(function() {
    const todas = props.alertas || [];
    if (todas.length === 0) return [];

    const prioridad = { 'CRITICA': 3, 'ALERTA': 2, 'AVISO': 1 };
    const porEquipo = {};

    todas.forEach(function(a) {
      const actual = porEquipo[a.equipo_id];
      if (!actual) {
        porEquipo[a.equipo_id] = a;
        return;
      }
      const prioActual = prioridad[actual.severidad] || 0;
      const prioNueva = prioridad[a.severidad] || 0;

      if (prioNueva > prioActual) {
        // Nueva alerta es más severa: la reemplaza
        porEquipo[a.equipo_id] = a;
      } else if (prioNueva === prioActual) {
        // Misma severidad: quedarse con la más reciente
        if (new Date(a.timestamp) > new Date(actual.timestamp)) {
          porEquipo[a.equipo_id] = a;
        }
      }
    });

    // Ordenar por severidad descendente (más crítica primero)
    return Object.values(porEquipo).sort(function(a, b) {
      const diffPrio = (prioridad[b.severidad] || 0) - (prioridad[a.severidad] || 0);
      if (diffPrio !== 0) return diffPrio;
      return new Date(b.timestamp) - new Date(a.timestamp);
    });
  }, [props.alertas]);

  // Reset del índice si cambia el número de alertas
  useEffect(function() {
    if (indiceActual >= alertas.length && alertas.length > 0) {
      setIndiceActual(0);
    }
  }, [alertas.length]);

  // Rotación automática cada 4 segundos
  useEffect(function() {
    if (alertas.length <= 1) return;
    const interval = setInterval(function() {
      setIndiceActual(function(actual) { return (actual + 1) % alertas.length; });
    }, 4000);
    return function() { clearInterval(interval); };
  }, [alertas.length]);

  if (alertas.length === 0) return null;

  const alertaActual = alertas[indiceActual] || alertas[0];
  if (!alertaActual) return null;

  const coloresSeveridad = {
    'CRITICA': { texto: 'text-red-300', border: 'border-red-500/50', bg: 'bg-red-950/30', badge: 'crit' },
    'ALERTA':  { texto: 'text-orange-200', border: 'border-orange-500/50', bg: 'bg-orange-950/30', badge: 'high' },
    'AVISO':   { texto: 'text-amber-200', border: 'border-amber-500/50', bg: 'bg-amber-950/30', badge: 'warn' },
  };
  const c = coloresSeveridad[alertaActual.severidad] || { texto: 'text-simea-text', border: 'border-simea-border', bg: 'bg-simea-card', badge: 'default' };

  return (
    <div className={"px-4 py-2 rounded-lg border " + c.border + " " + c.bg + " flex items-center gap-3 transition-opacity"} key={alertaActual.equipo_id + '|' + alertaActual.timestamp}>
      <Badge color={c.badge}>{alertaActual.severidad}</Badge>
      <span className={"text-sm font-medium " + c.texto}>{alertaActual.equipo_nombre || alertaActual.equipo_id}</span>
      {alertas.length > 1 && (
        <span className="text-xs text-simea-muted">
          {indiceActual + 1} / {alertas.length}
        </span>
      )}
    </div>
  );
}

function NotificacionesGlobales(props) {
  const [abierto, setAbierto] = useState(false);
  const dropdownRef = useRef(null);

  const alertasGlobales = props.alertas || [];

  // Cerrar dropdown al hacer clic fuera
  useEffect(function() {
    if (!abierto) return;
    function onClickFuera(e) {
      if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
        setAbierto(false);
      }
    }
    document.addEventListener('mousedown', onClickFuera);
    return function() { document.removeEventListener('mousedown', onClickFuera); };
  }, [abierto]);

  // Determinar severidad máxima entre todas las alertas
  const prioridad = { 'CRITICA': 3, 'ALERTA': 2, 'AVISO': 1 };
  const severidadMax = alertasGlobales.reduce(function(max, a) {
    return (prioridad[a.severidad] || 0) > (prioridad[max] || 0) ? a.severidad : max;
  }, null);

  const coloresSeveridad = {
    'CRITICA': { icono: 'text-red-400', badge: 'bg-red-500', ring: 'ring-red-500/40' },
    'ALERTA':  { icono: 'text-orange-300', badge: 'bg-orange-500', ring: 'ring-orange-500/40' },
    'AVISO':   { icono: 'text-amber-300', badge: 'bg-amber-500', ring: 'ring-amber-500/40' },
  };
  const c = coloresSeveridad[severidadMax] || { icono: 'text-simea-muted', badge: 'bg-simea-muted', ring: '' };
  const badgeSeveridadColor = { 'CRITICA': 'crit', 'ALERTA': 'high', 'AVISO': 'warn' };

  return (
    <>
      <div className="relative" ref={dropdownRef}>
        <button
          onClick={function() { setAbierto(function(v) { return !v; }); }}
          className={"relative w-10 h-10 rounded-lg flex items-center justify-center transition hover:bg-simea-card border border-simea-border " + (alertasGlobales.length > 0 ? "ring-2 " + c.ring : "")}
          title={alertasGlobales.length > 0 ? alertasGlobales.length + ' notificaciones pendientes' : 'Sin notificaciones'}
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={c.icono}>
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          {alertasGlobales.length > 0 && (
            <span className={"absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-bold text-white flex items-center justify-center " + c.badge}>
              {alertasGlobales.length > 99 ? '99+' : alertasGlobales.length}
            </span>
          )}
        </button>

        {/* Dropdown de notificaciones */}
        {abierto && (
          <div className="absolute right-0 mt-2 w-96 bg-simea-card border border-simea-border rounded-xl shadow-2xl z-50 overflow-hidden">
            <div className="p-4 border-b border-simea-border flex items-center justify-between">
              <h3 className="text-sm font-semibold text-simea-text">Notificaciones</h3>
              <span className="text-xs text-simea-muted">
                {alertasGlobales.length > 0 ? alertasGlobales.length + ' pendientes' : 'Sin pendientes'}
              </span>
            </div>
            <div className="max-h-96 overflow-y-auto scrollbar-thin">
              {alertasGlobales.length === 0 ? (
                <div className="p-6 text-center text-sm text-simea-muted">
                  No hay notificaciones pendientes
                </div>
              ) : (
                alertasGlobales.slice(0, 20).map(function(a) {
                  return (
                    <button
                      key={a.equipo_id + '|' + a.timestamp}
                      onClick={function() {
                        if (props.onIrAEquipo) props.onIrAEquipo(a.equipo_id, a.timestamp);
                        setAbierto(false);
                      }}
                      className="w-full text-left p-4 border-b border-simea-border last:border-b-0 hover:bg-simea-bg/40 transition"
                    >
                      <div className="flex items-center gap-2 mb-1 flex-wrap">
                        <Badge color={badgeSeveridadColor[a.severidad] || 'default'}>{a.severidad}</Badge>
                        <span className="text-xs text-simea-muted mono">{formatearFechaHora(a.timestamp)}</span>
                      </div>
                      <div className="text-sm font-medium text-simea-text">Anomalía detectada</div>
                      <div className="text-xs text-simea-muted mt-0.5">Equipo: {a.equipo_nombre || a.equipo_id}</div>
                    </button>
                  );
                })
              )}
            </div>
          </div>
        )}
      </div>
    </>
  );
}

// Componente reloj: fecha y hora actual actualizadas cada segundo
function Reloj() {
  const [ahora, setAhora] = useState(new Date());

  useEffect(function() {
    const interval = setInterval(function() { setAhora(new Date()); }, 1000);
    return function() { clearInterval(interval); };
  }, []);

  // Formato compacto: fecha arriba, hora abajo
  const fecha = moment(ahora).format('ddd D MMM');
  const hora = moment(ahora).format('HH:mm:ss');

  return (
    <div className="flex items-center gap-2 text-simea-muted">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <div className="text-right leading-tight">
        <div className="text-xs capitalize">{fecha}</div>
        <div className="text-sm mono text-simea-text">{hora}</div>
      </div>
    </div>
  );
}

      </div>

      {/* Zona derecha: reloj + campanita (siempre visible) */}
      <div className="flex items-center gap-4 flex-shrink-0">
        <Reloj />
        <NotificacionesGlobales
          alertas={props.alertas || []}
          onIrAEquipo={props.onIrAEquipo}
        />
      </div>
    </header>
  );
}

function App() {
  const [auth, setAuth] = useState(function() {
    const saved = sessionStorage.getItem('simea_auth');
    return saved ? JSON.parse(saved) : null;
  });
  const [vista, setVista] = useState('panel');
  const [estado, setEstado] = useState(null);
  const [equipo, setEquipo] = useState(null);
  const [equiposDisponibles, setEquiposDisponibles] = useState([]);
  const [equipoIdActual, setEquipoIdActual] = useState(EQUIPO_ID);
  const [alertasGlobales, setAlertasGlobales] = useState([]);
  const [alertaMarcadaId, setAlertaMarcadaId] = useState(null);
  // Contador que se incrementa para forzar recarga de vistas al cambiar de equipo
  const [recargaKey, setRecargaKey] = useState(0);
  // Estado del sidebar (colapsado por defecto, recordado en localStorage)
  const [sidebarExpandido, setSidebarExpandido] = useState(function() {
    const saved = localStorage.getItem('simea_sidebar_expandido');
    return saved === 'true';
  });
  useEffect(function() {
    localStorage.setItem('simea_sidebar_expandido', String(sidebarExpandido));
  }, [sidebarExpandido]);

  // Carga periódica de alertas de todos los equipos (compartida entre carrusel y campanita)
  useEffect(function() {
    if (!auth || !equiposDisponibles || equiposDisponibles.length === 0) return;

    function cargarAlertasDeTodos() {
      Promise.all(equiposDisponibles.map(function(eq) {
        return api.get('/api/equipos/' + eq.id + '/alertas?minutos=1440', auth.token)
          .then(function(r) {
            return (r.alertas || [])
              .filter(function(a) { return !a.reconocida; })
              .map(function(a) { return Object.assign({}, a, { equipo_id: eq.id, equipo_nombre: eq.nombre }); });
          })
          .catch(function() { return []; });
      }))
      .then(function(resultados) {
        const todas = [];
        resultados.forEach(function(arr) { arr.forEach(function(a) { todas.push(a); }); });
        todas.sort(function(a, b) { return new Date(b.timestamp) - new Date(a.timestamp); });
        setAlertasGlobales(todas);
      });
    }

    cargarAlertasDeTodos();
    const interval = setInterval(cargarAlertasDeTodos, POLLING_MS);
    return function() { clearInterval(interval); };
  }, [auth, equiposDisponibles]);

  const recargarEstado = useCallback(function() {
    if (!auth) return Promise.resolve();
    return api.get('/api/equipos/' + EQUIPO_ID + '/estado', auth.token)
      .then(function(r) { setEstado(r); })
      .catch(function(e) { console.error(e); });
  }, [auth]);

  function recargarEquiposDisponibles() {
    if (!auth) return Promise.resolve();
    return api.get('/api/equipos', auth.token)
      .then(function(r) {
        console.log('Equipos cargados:', r.equipos);
        setEquiposDisponibles(r.equipos || []);
      })
      .catch(function(e) { console.error('Error cargando lista de equipos:', e); });
  }

  // Cargar lista de equipos disponibles
  useEffect(function() {
    if (!auth) return;
    recargarEquiposDisponibles();
  }, [auth]);

  // Cargar información del equipo actual cada vez que cambia
  useEffect(function() {
    if (!auth) return;
    api.get('/api/equipos/' + EQUIPO_ID, auth.token)
      .then(function(r) { setEquipo(r); })
      .catch(function(e) { console.error('Error cargando equipo:', e); });
  }, [auth, equipoIdActual]);

  useEffect(function() {
    if (!auth) return;
    recargarEstado();
    const interval = setInterval(recargarEstado, POLLING_MS);
    return function() { clearInterval(interval); };
  }, [auth, recargarEstado, equipoIdActual]);

  function cambiarEquipo(nuevoEquipoId) {
    setEquipoId(nuevoEquipoId);
    setEquipoIdActual(nuevoEquipoId);
    setEstado(null);
    setEquipo(null);
    setRecargaKey(function(k) { return k + 1; });
  }

  function onLogin(data) {
    sessionStorage.setItem('simea_auth', JSON.stringify(data));
    setAuth(data);
  }

  function onLogout() {
    sessionStorage.removeItem('simea_auth');
    setAuth(null);
    setEquipo(null);
  }

  if (!auth) {
    return <LoginView onLogin={onLogin} />;
  }

  return (
    <div className="flex flex-col h-screen overflow-hidden">
      {/* Topbar global fijo: siempre visible */}
      <Topbar
        alertas={alertasGlobales}
        sidebarExpandido={sidebarExpandido}
        onToggleSidebar={function() { setSidebarExpandido(!sidebarExpandido); }}
        onIrPanel={function() { setVista('panel'); }}
        onIrAEquipo={function(equipoId, timestamp) {
          cambiarEquipo(equipoId);
          setAlertaMarcadaId(timestamp);
          setVista('historico');
        }}
      />

      {/* Contenedor sidebar + main debajo del topbar */}
      <div className="flex flex-1 overflow-hidden">
        <Sidebar
          vista={vista}
          setVista={setVista}
          usuario={auth}
          onLogout={onLogout}
          estado={estado}
          equipo={equipo}
          expandido={sidebarExpandido}
          setExpandido={setSidebarExpandido}
        />
        <main className="flex-1 overflow-y-auto scrollbar-thin">
          <div className="p-8">
            {vista === 'panel' && <PanelView key={recargaKey} token={auth.token} estado={estado} equipo={equipo} equiposDisponibles={equiposDisponibles} onCambiarEquipo={cambiarEquipo} irA={setVista} recargarEstado={recargarEstado} />}
            {vista === 'aprendizaje' && <AprendizajeView key={recargaKey} token={auth.token} estado={estado} equipo={equipo} recargarEstado={recargarEstado} recargarEquipos={recargarEquiposDisponibles} />}
            {vista === 'historico' && <HistoricoView key={recargaKey} token={auth.token} alertaMarcadaId={alertaMarcadaId} onLimpiarMarcado={function() { setAlertaMarcadaId(null); }} equipos={equiposDisponibles} />}
            {vista === 'configuracion' && auth.rol === 'supervisor' && <ConfiguracionView key={recargaKey} token={auth.token} usuarioActual={auth} recargarEquipos={recargarEquiposDisponibles} />}
            {vista === 'configuracion' && auth.rol !== 'supervisor' && (
              <div className="max-w-lg mx-auto mt-16">
                <Card className="p-8 text-center">
                  <div className="w-14 h-14 rounded-full bg-simea-bg/40 border border-simea-border flex items-center justify-center mx-auto mb-4">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-simea-muted">
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                  </div>
                  <h2 className="text-lg font-semibold mb-2">Acceso restringido</h2>
                  <p className="text-sm text-simea-muted mb-4">
                    La sección de configuración solo está disponible para usuarios con rol de supervisor.
                  </p>
                  <Button onClick={function() { setVista('panel'); }}>Volver al panel principal</Button>
                </Card>
              </div>
            )}
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
